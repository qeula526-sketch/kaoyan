<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>赛博地牢 · 三层协议</title>
<style>
  :root{
    --bg:#05060a; --ink:#dff3ff; --dim:#7c8ba6;
    --cyan:#22d3ee; --mag:#f472b6; --amber:#ffb347; --vio:#a78bfa; --ok:#34d399; --hp:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--bg);touch-action:none}
  #hud{position:fixed;left:0;right:0;top:0;padding:9px 12px;display:flex;gap:14px;align-items:center;
       font-size:12px;letter-spacing:.06em;pointer-events:none;text-shadow:0 1px 0 #000;
       font-family:ui-monospace,"Consolas",monospace}
  .bar{width:96px;height:7px;border:1px solid rgba(34,211,238,.5);background:rgba(34,211,238,.08);position:relative}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .2s}
  .bar.low i{background:linear-gradient(90deg,#ff4d6d,#ffb347)}
  #hud .k{color:var(--dim)}
  #hud .v{color:var(--cyan)}
  #hud .f{color:var(--amber)}
  #hud .g{color:var(--amber)}
  #hud .u{color:var(--vio)}
  #msg{position:fixed;left:50%;top:46px;transform:translateX(-50%);font-size:12.5px;color:#c8f5ff;
       text-align:center;pointer-events:none;text-shadow:0 0 8px rgba(34,211,238,.7);opacity:0;transition:opacity .3s;
       font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}
  #msg.on{opacity:1}
  .panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,5,10,.9);
         text-align:center;padding:22px;z-index:9;backdrop-filter:blur(2px)}
  .panel.hide{display:none}
  .panel h1{font-size:23px;letter-spacing:.22em;margin-bottom:12px;color:#c8f5ff;
            text-shadow:0 0 14px rgba(34,211,238,.7)}
  .panel p{font-size:13px;line-height:2.05;color:var(--dim);max-width:460px;margin:0 auto 18px}
  .panel kbd{background:#101827;border:1px solid #24344d;border-bottom-width:2px;border-radius:4px;
             padding:1px 7px;font-size:12px;color:#9fe9ff;font-family:ui-monospace,monospace}
  .panel button{font:inherit;font-size:14px;padding:11px 30px;border-radius:6px;cursor:pointer;
      border:1px solid rgba(34,211,238,.5);background:linear-gradient(180deg,#0d2b38,#071a22);
      color:#8ff3ff;letter-spacing:.18em;text-shadow:0 0 8px rgba(34,211,238,.6)}
  .panel button:active{transform:translateY(1px)}

  /* 三选一 */
  #cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .card{width:176px;padding:15px 13px;text-align:left;cursor:pointer;
        border:1px solid rgba(34,211,238,.35);background:linear-gradient(160deg,#0a1119,#060a10);
        border-radius:8px;transition:transform .12s,border-color .12s,box-shadow .12s}
  .card:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.9);
              box-shadow:0 0 22px rgba(34,211,238,.28)}
  .card .ic{font-size:19px;margin-bottom:7px}
  .card .nm{font-size:14px;color:#c8f5ff;margin-bottom:5px;letter-spacing:.05em}
  .card .ds{font-size:11.5px;color:var(--dim);line-height:1.65}
  .card .rt{font-size:10px;color:var(--amber);margin-top:8px;letter-spacing:.08em}
  #hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;color:#415066;
        font-family:ui-monospace,monospace;letter-spacing:.1em;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hud"></div>
<div id="msg"></div>
<div id="hint">WASD 移动 · J/空格/左键 攻击 · SHIFT 冲刺 · 下楼前会给你强化</div>

<div class="panel" id="titlePanel">
  <div>
    <h1>赛博地牢</h1>
    <p>
      三层协议，每下一层，装一次义体强化。<br>
      <kbd>WASD</kbd> 移动　<kbd>J</kbd>／<kbd>空格</kbd>／左键 攻击　<kbd>SHIFT</kbd> 冲刺<br>
      走到 <span style="color:#22d3ee">▼ 数据门</span> 下潜；第三层有守关者。
    </p>
    <button id="startBtn">接 入 网 络</button>
  </div>
</div>

<div class="panel hide" id="cardPanel">
  <div>
    <h1 id="cardTitle">义 体 升 级</h1>
    <p style="margin-bottom:16px">选一个，装进身体。</p>
    <div id="cards"></div>
  </div>
</div>

<div class="panel hide" id="endPanel">
  <div>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button id="againBtn">再 来 一 次</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const hudEl = document.getElementById('hud');
const msgEl = document.getElementById('msg');
const titlePanel = document.getElementById('titlePanel');
const cardPanel = document.getElementById('cardPanel');
const endPanel = document.getElementById('endPanel');
const cardsEl = document.getElementById('cards');
const startBtn = document.getElementById('startBtn');
const againBtn = document.getElementById('againBtn');

const TS = 16, VIEW_W = 27, VIEW_H = 16;
let scale = 1, W = 0, H = 0;

function resize() {
  const raw = Math.min(window.innerWidth / (VIEW_W * TS), window.innerHeight / (VIEW_H * TS));
  const s = Math.max(1, Math.round(raw * 4) / 4);
  scale = s; W = VIEW_W * TS; H = VIEW_H * TS;
  cvs.width = W; cvs.height = H;
  cvs.style.width = (W * s) + 'px'; cvs.style.height = (H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ================= 地图 =================
const MW = 64, MH = 44, T_WALL = 1, T_FLOOR = 0, T_GATE = 2;

function makeMap(floor) {
  const want = Math.min(14, 9 + floor * 2);
  let best = null;
  for (let attempt = 0; attempt < 4; attempt++) {
    const m = makeMapOnce(floor, want - attempt * 2);
    if (!best || m.rooms.length > best.rooms.length) best = m;
    if (best.rooms.length >= Math.min(want, 7)) break;
  }
  return best;
}

function makeMapOnce(floor, want) {
  const g = Array.from({ length: MH }, () => new Array(MW).fill(T_WALL));
  const rooms = [];
  for (let i = 0; i < 60 && rooms.length < Math.max(6, want); i++) {
    const w = ri(8, 14), h = ri(7, 10), x = ri(1, MW - w - 2), y = ri(1, MH - h - 2);
    const r = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };
    if (rooms.some(o => !(r.x + r.w + 2 < o.x || o.x + o.w + 2 < r.x || r.y + r.h + 2 < o.y || o.y + o.h + 2 < r.y))) continue;
    rooms.push(r);
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) g[yy][xx] = T_FLOOR;
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    let x = a.cx, y = a.cy;
    while (x !== b.cx) { g[y][x] = T_FLOOR; x += Math.sign(b.cx - x); }
    while (y !== b.cy) { g[y][x] = T_FLOOR; y += Math.sign(b.cy - y); }
    g[b.cy][b.cx] = T_FLOOR;
  }
  const last = rooms[rooms.length - 1];
  g[last.cy][last.cx] = T_GATE;
  return { g, rooms, start: { x: rooms[0].cx, y: rooms[0].cy }, gate: { x: last.cx, y: last.cy }, seed: Math.random() * 999 };
}
const isFloor = (g, x, y) => x >= 0 && y >= 0 && x < MW && y < MH && g[y][x] !== T_WALL;

// ================= 玩家 =================
const P = {
  x: 0, y: 0, r: 5, hp: 100, hpMax: 100,
  atk: 14, atkCd: 0, atkRate: 0.30, spd: 74, reach: 18, arc: 1.05,
  dashCd: 0, dashT: 0, inv: 0, crit: 0.08, lifesteal: 0, splash: 0,
  gold: 0, dir: 0, face: 1, walk: 0, dead: false
};

// ================= 敌人 =================
const ET = {
  drone:  { hp: 16, spd: 34, r: 7, dmg: 8,  col: '#7ee081', name: '无人机' },
  spider: { hp: 12, spd: 62, r: 6, dmg: 6,  col: '#a78bfa', name: '猎杀蛛' },
  turret: { hp: 20, spd: 22, r: 7, dmg: 7,  col: '#22d3ee', name: '炮塔' }
};
let map, floorNo = 1, enemies = [], bullets = [], drops = [], fx = [], floats = [];
let camX = 0, camY = 0, running = false, paused = false, shake = 0, gateReady = true;
let totalKills = 0, runTime = 0;

function spawnEnemies() {
  enemies = [];
  const n = 7 + floorNo * 3;
  for (let i = 0; i < n; i++) {
    const pool = map.rooms.length > 1 ? map.rooms.slice(1) : map.rooms;
    const r = pool.length ? pick(pool) : map.rooms[0];
    const type = floorNo >= 2 && i % 4 === 0 ? 'turret' : (floorNo >= 2 && i % 3 === 0 ? 'spider' : 'drone');
    const b = ET[type];
    const hp = Math.round(b.hp * (1 + (floorNo - 1) * 0.5));
    enemies.push({
      type, x: r.x * TS + ri(3, r.w * TS - 3), y: r.y * TS + ri(3, r.h * TS - 3),
      hp, hpMax: hp, r: b.r, spd: b.spd + floorNo * 3, dmg: b.dmg, col: b.col,
      cd: rnd(0.5, 2), hurt: 0, wob: rnd(0, 6.28)
    });
  }
  if (floorNo === 3) {
    const r = map.rooms[map.rooms.length - 1];
    enemies.push({
      type: 'boss', boss: true, x: r.cx * TS, y: (r.cy - 2) * TS,
      hp: 220, hpMax: 220, r: 11, spd: 34, dmg: 14, col: '#f472b6',
      cd: 1.4, hurt: 0, wob: 0
    });
  }
}

// ================= 强化卡 =================
const UPGRADES = [
  { id: 'atk',    ic: '⚔', nm: '斩击增幅', ds: '攻击力 +5',                 rt: '输出', fn: () => P.atk += 5 },
  { id: 'rate',   ic: '⚡', nm: '伺服关节', ds: '攻击速度 +22%',            rt: '输出', fn: () => P.atkRate *= 0.78 },
  { id: 'reach',  ic: '↔', nm: '延展刀刃', ds: '攻击范围 +25%',             rt: '输出', fn: () => P.reach *= 1.25 },
  { id: 'crit',   ic: '✶', nm: '致命算法', ds: '暴击率 +15%（双倍伤害）',   rt: '输出', fn: () => P.crit += 0.15 },
  { id: 'splash', ic: '◎', nm: '冲击波',   ds: '命中时对周围敌人造成 40% 伤害', rt: '输出', fn: () => P.splash += 0.4 },
  { id: 'hp',     ic: '♥', nm: '扩容血槽', ds: '生命上限 +25 并回满',       rt: '生存', fn: () => { P.hpMax += 25; P.hp = P.hpMax; } },
  { id: 'heal',   ic: '✚', nm: '纳米修复', ds: '立刻回复 60 生命',          rt: '生存', fn: () => P.hp = Math.min(P.hpMax, P.hp + 60) },
  { id: 'steal',  ic: '⌁', nm: '吸血回路', ds: '造成伤害的 18% 回复自身',   rt: '生存', fn: () => P.lifesteal += 0.18 },
  { id: 'speed',  ic: '»', nm: '加速芯片', ds: '移动速度 +14',              rt: '机动', fn: () => P.spd += 14 },
  { id: 'dash',   ic: '≡', nm: '冲刺冷却', ds: '冲刺冷却 -35%',             rt: '机动', fn: () => dashMul *= 0.65 },
];
let dashMul = 1;

function offerCards() {
  paused = true;
  const pool = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
  cardsEl.innerHTML = '';
  for (const u of pool) {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="ic" style="color:var(--cyan)">${u.ic}</div>
      <div class="nm">${u.nm}</div><div class="ds">${u.ds}</div>
      <div class="rt">${u.rt}</div>`;
    d.onclick = () => {
      u.fn();
      cardPanel.classList.add('hide');
      paused = false;
      toast('已装载：' + u.nm);
      updateHUD();
    };
    cardsEl.appendChild(d);
  }
  cardPanel.classList.remove('hide');
}

// ================= 输入 =================
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let mouseAtk = false, mousePos = { x: 0, y: 0, has: false };
cvs.addEventListener('mousemove', e => {
  const b = cvs.getBoundingClientRect();
  mousePos.x = (e.clientX - b.left) / scale; mousePos.y = (e.clientY - b.top) / scale; mousePos.has = true;
});
cvs.addEventListener('mousedown', e => { if (e.button === 0) mouseAtk = true; });
addEventListener('mouseup', () => { mouseAtk = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());

// 触屏（保留但不强调）
let tMove = null, tId = null;
cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const b = cvs.getBoundingClientRect();
    const x = (t.clientX - b.left) / scale, y = (t.clientY - b.top) / scale;
    if (t.clientX < b.left + b.width / 2) { tId = t.identifier; tMove = { x, y, ox: x, oy: y }; }
    else attack();
  }
}, { passive: false });
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === tId) {
    const b = cvs.getBoundingClientRect();
    tMove.x = (t.clientX - b.left) / scale; tMove.y = (t.clientY - b.top) / scale;
  }
}, { passive: false });
cvs.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === tId) { tMove = null; tId = null; }
}, { passive: false });

// ================= 战斗 =================
const floatText = (x, y, txt, col) => floats.push({ x, y, txt, col, t: 0.85 });
function burst(x, y, col, n) {
  for (let i = 0; i < (n || 6); i++) {
    const a = rnd(0, 6.28), s = rnd(24, 86);
    fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.4, col });
  }
}

function damageEnemy(e, dmg, kx, ky) {
  const crit = Math.random() < P.crit;
  const real = Math.round(dmg * (crit ? 2 : 1));
  e.hp -= real; e.hurt = 0.12;
  if (kx) { e.x += kx * 4; e.y += ky * 4; }
  burst(e.x, e.y, e.col, crit ? 9 : 5);
  floatText(e.x, e.y - 7, (crit ? '✶' : '') + '-' + real, crit ? '#ffb347' : '#ffffff');
  if (P.lifesteal > 0) P.hp = Math.min(P.hpMax, P.hp + Math.round(real * P.lifesteal));
  if (P.splash > 0) {
    for (const o of [...enemies]) {
      if (o !== e && dist(o, e) < 26) damageEnemy(o, Math.round(real * P.splash), 0, 0);
    }
  }
  if (e.hp <= 0) {
    burst(e.x, e.y, e.col, e.boss ? 40 : 14);
    totalKills++;
    P.gold += e.boss ? 60 : ri(1, 4);
    shake = Math.max(shake, e.boss ? 12 : 3);
    if (Math.random() < (e.boss ? 1 : 0.16)) drops.push({ x: e.x, y: e.y, kind: 'heal', t: 0 });
    if (Math.random() < 0.09) drops.push({ x: e.x, y: e.y, kind: 'power', t: 0 });
    enemies.splice(enemies.indexOf(e), 1);
    if (e.boss) win();
  }
}

function hurtPlayer(dmg, fromX, fromY) {
  if (P.inv > 0 || !running) return;
  P.hp -= dmg; P.inv = 0.85; shake = 7;
  burst(P.x, P.y, '#ff4d6d', 10);
  floatText(P.x, P.y - 9, '-' + dmg, '#ff4d6d');
  if (fromX !== undefined) {
    const a = Math.atan2(P.y - fromY, P.x - fromX);
    P.x += Math.cos(a) * 9; P.y += Math.sin(a) * 9;
  }
  if (P.hp <= 0) { P.hp = 0; lose(); }
}

function attack() {
  if (!running || paused || P.atkCd > 0 || P.dashT > 0) return;
  P.atkCd = P.atkRate;
  let ang = P.dir;
  if (mousePos.has) {
    const wx = camX + mousePos.x, wy = camY + mousePos.y;
    if (Math.hypot(wx - P.x, wy - P.y) < P.reach + 44) ang = Math.atan2(wy - P.y, wx - P.x);
  }
  P.dir = ang;
  let hit = false;
  for (const e of [...enemies]) {
    const a = Math.atan2(e.y - P.y, e.x - P.x);
    const dOk = Math.abs(((a - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI) < P.arc;
    if (dist(e, P) < P.reach + e.r && dOk) {
      damageEnemy(e, P.atk + ri(0, 3), Math.cos(a), Math.sin(a));
      hit = true;
    }
  }
  fx.push({ slash: true, x: P.x, y: P.y, a: ang, t: 0.15, reach: P.reach });
  if (hit) shake = Math.max(shake, 3);
}

// ================= 更新 =================
function update(dt) {
  if (!running || paused) return;
  runTime += dt;

  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft']) ix--;
  if (keys['d'] || keys['arrowright']) ix++;
  if (keys['w'] || keys['arrowup']) iy--;
  if (keys['s'] || keys['arrowdown']) iy++;
  if (tMove) {
    const dx = tMove.x - tMove.ox, dy = tMove.y - tMove.oy;
    if (Math.hypot(dx, dy) > 6) { ix = dx / 34; iy = dy / 34; }
  }
  const len = Math.hypot(ix, iy) || 1; ix /= len; iy /= len;
  if (ix || iy) { P.dir = Math.atan2(iy, ix); if (ix) P.face = ix > 0 ? 1 : -1; P.walk += dt * 11; }

  P.dashCd = Math.max(0, P.dashCd - dt);
  if (keys['shift'] && P.dashCd <= 0 && (ix || iy)) {
    P.dashCd = 1.1 * dashMul; P.dashT = 0.16; P.inv = Math.max(P.inv, 0.32);
    burst(P.x, P.y, '#22d3ee', 10);
  }
  let spd = P.spd;
  if (P.dashT > 0) { spd = 300; P.dashT -= dt; }

  const nx = P.x + ix * spd * dt, ny = P.y + iy * spd * dt;
  if (isFloor(map.g, Math.floor(nx / TS), Math.floor(P.y / TS))) P.x = nx;
  if (isFloor(map.g, Math.floor(P.x / TS), Math.floor(ny / TS))) P.y = ny;

  P.atkCd = Math.max(0, P.atkCd - dt);
  P.inv = Math.max(0, P.inv - dt);
  if (keys['j'] || keys[' '] || mouseAtk) attack();

  const camW = VIEW_W * TS, camH = VIEW_H * TS;
  camX += ((P.x - camW / 2) - camX) * Math.min(1, dt * 11);
  camY += ((P.y - camH / 2) - camY) * Math.min(1, dt * 11);
  camX = clamp(camX, 0, MW * TS - camW);
  camY = clamp(camY, 0, MH * TS - camH);

  // 敌人
  for (const e of [...enemies]) {
    e.hurt = Math.max(0, e.hurt - dt); e.cd -= dt;
    const d = dist(e, P);
    const a = Math.atan2(P.y - e.y, P.x - e.x);
    if (e.type === 'turret') {
      const want = e.boss ? 46 : 74;
      const dv = d > want ? 1 : (d < want - 24 ? -0.7 : 0);
      e.x += Math.cos(a) * e.spd * dv * dt; e.y += Math.sin(a) * e.spd * dv * dt;
      if (e.cd <= 0 && d < (e.boss ? 220 : 150)) {
        e.cd = e.boss ? 0.75 : 1.9;
        const n = e.boss ? 3 : 1;
        for (let i = 0; i < n; i++) {
          const ang2 = a + (i - (n - 1) / 2) * 0.22;
          bullets.push({ x: e.x, y: e.y, vx: Math.cos(ang2) * 96, vy: Math.sin(ang2) * 96, r: 3, t: 3.4, col: e.boss ? '#f472b6' : '#22d3ee' });
        }
      }
    } else {
      if (d < 240) { e.x += Math.cos(a) * e.spd * dt; e.y += Math.sin(a) * e.spd * dt; }
      if (d < e.r + P.r + 1 && e.cd <= 0) {
        hurtPlayer(e.dmg, e.x, e.y);
        e.x -= Math.cos(a) * 12; e.y -= Math.sin(a) * 12; e.cd = 0.7;
      }
    }
    if (!isFloor(map.g, Math.floor(e.x / TS), Math.floor(e.y / TS))) {
      e.x -= Math.cos(a) * e.spd * dt; e.y -= Math.sin(a) * e.spd * dt;
    }
  }

  for (const b of [...bullets]) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt;
    if (b.t <= 0 || !isFloor(map.g, Math.floor(b.x / TS), Math.floor(b.y / TS))) { bullets.splice(bullets.indexOf(b), 1); continue; }
    if (dist(b, P) < b.r + P.r) { hurtPlayer(6, b.x, b.y); bullets.splice(bullets.indexOf(b), 1); }
  }

  for (const d of [...drops]) {
    d.t += dt;
    if (dist(d, P) < 13) {
      if (d.kind === 'heal') { P.hp = Math.min(P.hpMax, P.hp + 30); floatText(P.x, P.y - 11, '+30', '#34d399'); }
      else { P.atk += 3; floatText(P.x, P.y - 11, '攻击+3', '#ffb347'); }
      drops.splice(drops.indexOf(d), 1); burst(d.x, d.y, '#ffb347', 10);
    }
  }

  const tx = Math.floor(P.x / TS), ty = Math.floor(P.y / TS);
  if (map.g[ty] && map.g[ty][tx] === T_GATE && gateReady) {
    gateReady = false;
    if (floorNo >= 3) { /* 第三层没有更深的门，靠杀 boss */ }
    else { nextFloor(); }
  }
  if (map.g[ty] && map.g[ty][tx] !== T_GATE) gateReady = true;

  for (const f of [...fx]) { f.t -= dt; if (f.t <= 0) fx.splice(fx.indexOf(f), 1); else if (!f.slash) { f.x += f.vx * dt; f.y += f.vy * dt; } }
  for (const t of [...floats]) { t.t -= dt; t.y -= 16 * dt; if (t.t <= 0) floats.splice(floats.indexOf(t), 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  updateHUD();
}

function nextFloor() {
  floorNo++;
  toast('第 ' + floorNo + ' 层 · 协议未完成');
  loadFloor();
  offerCards();
}

function win() {
  running = false;
  document.getElementById('endTitle').textContent = '协 议 完 成';
  document.getElementById('endText').innerHTML =
    `你砍穿了第三层，用时 <b style="color:#22d3ee">${Math.floor(runTime)}s</b>，` +
    `击杀 <b style="color:#22d3ee">${totalKills}</b> 个目标，攒了 <b style="color:#ffb347">${P.gold}</b> 金币。`;
  endPanel.classList.remove('hide');
}

function lose() {
  running = false; P.dead = true;
  document.getElementById('endTitle').textContent = '连 接 中 断';
  document.getElementById('endText').innerHTML =
    `你倒在 <b style="color:#f472b6">第 ${floorNo} 层</b>，击杀 <b style="color:#22d3ee">${totalKills}</b> 个目标。`;
  endPanel.classList.remove('hide');
}

const toast = (() => {
  let t;
  return txt => { msgEl.textContent = txt; msgEl.classList.add('on'); clearTimeout(t); t = setTimeout(() => msgEl.classList.remove('on'), 1400); };
})();

// ================= 绘制 =================
function drawTile(x, y, kind) {
  const px = x * TS, py = y * TS;
  if (kind === T_WALL) {
    // 墙：中灰蓝实体块，顶部亮面，底部阴影 —— 靠"亮"把房间围出来
    ctx.fillStyle = '#1d2c47'; ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = '#2a3d5e'; ctx.fillRect(px, py, TS, 1);            // 上沿高光
    ctx.fillStyle = '#111a29'; ctx.fillRect(px, py + TS - 2, TS, 2);    // 下沿阴影
    ctx.fillStyle = 'rgba(6,10,16,.45)';                                 // 砖缝
    ctx.fillRect(px + TS - 1, py, 1, TS);
    ctx.fillStyle = 'rgba(6,10,16,.28)';
    ctx.fillRect(px, py + ((y % 2) ? TS / 2 : 0), TS, 1);
    if ((x * 7 + y * 13) % 9 === 0) {
      ctx.fillStyle = 'rgba(34,211,238,.65)';
      ctx.fillRect(px + 5, py + 9, 6, 1); ctx.fillRect(px + 10, py + 9, 1, 4);
    }
  } else if (kind === T_GATE) {
    ctx.fillStyle = '#061119'; ctx.fillRect(px, py, TS, TS);
    const t = performance.now() / 220;
    for (let i = 0; i < 4; i++) {
      const yy = py + 2 + ((i * 4 + t * 7) % 13);
      ctx.fillStyle = i % 2 ? '#22d3ee' : '#8ff3ff';
      ctx.fillRect(px + 4, Math.floor(yy), TS - 8, 1);
    }
    ctx.strokeStyle = 'rgba(34,211,238,.9)'; ctx.lineWidth = 1;
    ctx.strokeRect(px + 2.5, py + 2.5, TS - 5, TS - 5);
  } else {
    // 地板：近黑 + 极淡网格（给空间感，又不抢戏）
    ctx.fillStyle = '#080c14'; ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = 'rgba(34,211,238,.055)';
    ctx.fillRect(px, py, TS, 1); ctx.fillRect(px, py, 1, TS);
    if ((x * 3 + y * 5) % 19 === 0) {
      ctx.fillStyle = 'rgba(34,211,238,.16)'; ctx.fillRect(px + 6, py + 6, 4, 4);
      ctx.fillStyle = 'rgba(34,211,238,.06)'; ctx.fillRect(px + 5, py + 5, 6, 6);
    }
    if ((x * 11 + y * 7) % 31 === 0) {
      ctx.fillStyle = 'rgba(167,139,250,.22)'; ctx.fillRect(px + 7, py + 7, 2, 2);
    }
  }
}

function drawPlayer() {
  const x = Math.round(P.x), y = Math.round(P.y), bob = Math.sin(P.walk) * 1;
  if (P.inv > 0 && Math.floor(P.inv * 22) % 2 === 0) return;
  const pg = ctx.createRadialGradient(x, y, 2, x, y, 26);
  pg.addColorStop(0, 'rgba(34,211,238,.20)'); pg.addColorStop(1, 'transparent');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, y, 26, 0, 6.29); ctx.fill();
  ctx.fillStyle = 'rgba(34,211,238,.16)'; ctx.beginPath(); ctx.ellipse(x, y + 7, 8, 3, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#cfefff'; ctx.fillRect(x - 4, y - 10 + bob, 8, 10);
  ctx.fillStyle = '#22d3ee'; ctx.fillRect(x - 4, y - 10 + bob, 8, 3);
  ctx.fillStyle = '#06121a'; ctx.fillRect(x - 2 + (P.face > 0 ? 1 : -1), y - 6 + bob, 2, 2);
  ctx.fillStyle = '#8ff3ff'; ctx.fillRect(x - 4, y + bob, 3, 4); ctx.fillRect(x + 1, y + bob, 3, 4);
  if (P.atkCd > P.atkRate * 0.45) {
    ctx.save(); ctx.translate(x, y - 2); ctx.rotate(P.dir);
    ctx.fillStyle = '#dff9ff'; ctx.fillRect(7, -1.5, P.reach * 0.75, 3);
    ctx.fillStyle = 'rgba(34,211,238,.8)'; ctx.fillRect(7, -1.5, P.reach * 0.75, 1);
    ctx.restore();
  }
}

function drawEnemy(e) {
  const x = Math.round(e.x), y = Math.round(e.y);
  // 外发光
  const g = ctx.createRadialGradient(x, y, 1, x, y, e.r * 3);
  g.addColorStop(0, e.col + '55'); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 3, 0, 6.29); ctx.fill();
  const bob = Math.sin(performance.now() / 260 + e.wob) * (e.type === 'spider' ? 1.6 : 1);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x, y + e.r * 0.85, e.r, 2.6, 0, 0, 6.29); ctx.fill();
  const col = e.hurt > 0 ? '#ffffff' : e.col;
  ctx.fillStyle = col;
  if (e.type === 'drone') {
    ctx.fillRect(x - e.r, y - e.r + bob, e.r * 2, e.r * 2 - 2);
    ctx.fillStyle = '#05121a'; ctx.fillRect(x - 2, y - 2 + bob, 4, 3);
  } else if (e.type === 'spider') {
    ctx.fillRect(x - 4, y - 3 + bob, 8, 6);
    ctx.fillRect(x - 8, y - 2 + bob, 4, 2); ctx.fillRect(x + 4, y - 2 + bob, 4, 2);
  } else if (e.type === 'turret') {
    ctx.fillRect(x - 5, y - 7 + bob, 10, 11);
    ctx.fillStyle = '#04121a'; ctx.fillRect(x - 2, y - 5 + bob, 4, 4);
  } else {
    ctx.fillRect(x - e.r, y - e.r + bob, e.r * 2, e.r * 2 - 2);
    ctx.fillStyle = '#2a0a1c'; ctx.fillRect(x - 7, y - 2 + bob, 14, 3);
    ctx.fillStyle = '#ffe9f5'; ctx.fillRect(x - 6, y - e.r + 3 + bob, 3, 3); ctx.fillRect(x + 3, y - e.r + 3 + bob, 3, 3);
  }
  if (e.hp < e.hpMax && !e.boss) {
    const w = e.r * 2.2;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - w / 2, y - e.r - 7, w, 2);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(x - w / 2, y - e.r - 7, w * (e.hp / e.hpMax), 2);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  if (!map) return;
  let sx = 0, sy = 0;
  if (shake > 0) { sx = rnd(-shake, shake) * .6; sy = rnd(-shake, shake) * .6; }
  ctx.save(); ctx.translate(-Math.floor(camX) + sx, -Math.floor(camY) + sy);

  const x0 = Math.floor(camX / TS) - 1, y0 = Math.floor(camY / TS) - 1;
  for (let y = y0; y <= y0 + VIEW_H + 2; y++)
    for (let x = x0; x <= x0 + VIEW_W + 2; x++) {
      if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
      drawTile(x, y, map.g[y][x]);
    }

  for (const d of drops) {
    const yy = d.y + Math.sin(d.t * 4) * 1.6;
    if (d.kind === 'heal') {
      ctx.fillStyle = '#34d399';
      ctx.fillRect(d.x - 4, yy - 1, 8, 3); ctx.fillRect(d.x - 1, yy - 4, 3, 8);
    } else {
      ctx.fillStyle = '#ffb347'; ctx.fillRect(d.x - 3, yy - 3, 6, 6);
      ctx.fillStyle = '#05060a'; ctx.fillRect(d.x - 1, yy - 1, 2, 2);
    }
  }
  for (const e of enemies) drawEnemy(e);
  for (const b of bullets) {
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  }
  if (!P.dead) drawPlayer();

  for (const f of fx) {
    if (f.slash) {
      ctx.save(); ctx.translate(f.x, f.y - 2); ctx.rotate(f.a);
      ctx.strokeStyle = 'rgba(143,243,255,' + (f.t / 0.15) + ')';
      ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, f.reach, -0.6, 0.6); ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalAlpha = Math.max(0, f.t / 0.4); ctx.fillStyle = f.col;
      ctx.fillRect(f.x - 1, f.y - 1, 2, 2); ctx.globalAlpha = 1;
    }
  }
  ctx.font = '7px ui-monospace,monospace'; ctx.textAlign = 'center';
  for (const t of floats) {
    ctx.globalAlpha = Math.min(1, t.t / 0.45);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y); ctx.globalAlpha = 1;
  }
  ctx.restore();

  const grd = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .34, W / 2, H / 2, Math.max(W, H) * .74);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  drawMinimap();
  const boss = enemies.find(e => e.boss);
  if (boss) {
    const w = W * .46, x = (W - w) / 2, y = H - 13;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - 1, y - 1, w + 2, 7);
    ctx.fillStyle = '#f472b6'; ctx.fillRect(x, y, w * clamp(boss.hp / boss.hpMax, 0, 1), 5);
  }
}

function drawMinimap() {
  const s = 1.3, ox = W - MW * s - 6, oy = 6;
  ctx.globalAlpha = .5;
  ctx.fillStyle = '#05060a'; ctx.fillRect(ox - 2, oy - 2, MW * s + 4, MH * s + 4);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (map.g[y][x] === T_WALL) continue;
    ctx.fillStyle = map.g[y][x] === T_GATE ? '#22d3ee' : '#22303f';
    ctx.fillRect(ox + x * s, oy + y * s, s, s);
  }
  ctx.fillStyle = '#dff9ff'; ctx.fillRect(ox + (P.x / TS) * s - 1, oy + (P.y / TS) * s - 1, 2.5, 2.5);
  ctx.globalAlpha = 1;
}

// ================= HUD =================
function updateHUD() {
  const pct = Math.round(P.hp / P.hpMax * 100);
  hudEl.innerHTML =
    `<span class="k">HP</span><span class="bar ${pct < 35 ? 'low' : ''}"><i style="width:${pct}%"></i></span>` +
    `<span class="f">层 ${floorNo}/3</span>` +
    `<span class="g">◆ ${P.gold}</span>` +
    `<span class="u">攻 ${P.atk} · 速 ${(1 / P.atkRate).toFixed(1)}/s · 暴 ${Math.round(P.crit * 100)}%</span>` +
    `<span class="k">${P.dashCd > 0 ? '冲刺 ' + P.dashCd.toFixed(1) + 's' : '冲刺就绪'}</span>`;
}

// ================= 流程 =================
function loadFloor() {
  map = makeMap(floorNo);
  P.x = map.start.x * TS + TS / 2; P.y = map.start.y * TS + TS / 2;
  P.inv = 0.8;
  enemies = []; bullets = []; drops = []; fx = []; floats = [];
  spawnEnemies();
  camX = clamp(P.x - VIEW_W * TS / 2, 0, MW * TS - VIEW_W * TS);
  camY = clamp(P.y - VIEW_H * TS / 2, 0, MH * TS - VIEW_H * TS);
  gateReady = true;
  updateHUD();
}

function showFatal(msg) {
  endPanel.classList.remove('hide');
  document.getElementById('endTitle').textContent = '出 错 了';
  document.getElementById('endText').innerHTML =
    '<span style="color:#ffb347;font-size:12px;font-family:monospace">' + String(msg).slice(0, 300) + '</span>';
}
addEventListener('error', ev => { try { showFatal(ev.message + ' @' + (ev.lineno || 0)); } catch (e) {} });

function startGame() {
  try { startGameInner(); } catch (e) { console.error(e); showFatal(e && e.message ? e.message : e); }
}

function startGameInner() {
  floorNo = 1; totalKills = 0; runTime = 0; dashMul = 1;
  P.hpMax = 100; P.hp = 100; P.atk = 14; P.atkRate = 0.30; P.reach = 18;
  P.spd = 74; P.crit = 0.08; P.lifesteal = 0; P.splash = 0; P.gold = 0;
  P.dead = false; P.atkCd = 0; P.dashCd = 0; P.dashT = 0; P.inv = 0;
  titlePanel.classList.add('hide'); endPanel.classList.add('hide'); cardPanel.classList.add('hide');
  loadFloor(); running = true; paused = false;
  toast('第 1 层 · 找到 ▼ 数据门');
}

['pointerdown', 'click', 'touchstart'].forEach(ev =>
  startBtn.addEventListener(ev, e => { e.preventDefault(); startGame(); }, { passive: false }));
['pointerdown', 'click', 'touchstart'].forEach(ev =>
  againBtn.addEventListener(ev, e => { e.preventDefault(); startGame(); }, { passive: false }));
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'enter' || k === ' ') && !running) { e.preventDefault(); startGame(); }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

if (location.search.includes('autostart')) setTimeout(() => startGame(), 200);
resize();
map = makeMap(1);
P.x = map.start.x * TS; P.y = map.start.y * TS;
updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
