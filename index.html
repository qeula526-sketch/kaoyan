<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>考研学习工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研">

<style>
/* ==========================================================================
   1. 设计令牌（浅色 / 深色）
   ========================================================================== */
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --card-2:#FCFBF8;
  --text:#1F2A27; --muted:#6B7A75; --faint:#93A29C;
  --primary:#2F5D50; --on-primary:#FFFFFF;
  --accent:#E8835A; --success:#4C9A6B; --warn:#D9A441; --danger:#C9534A;
  --border:rgba(31,42,39,.10); --border-2:rgba(31,42,39,.16);
  --track:rgba(31,42,39,.08);
  --shadow:0 1px 2px rgba(31,42,39,.04), 0 6px 18px rgba(31,42,39,.05);
  --shadow-lg:0 12px 40px rgba(31,42,39,.14);
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --nav-w:214px;
}
html[data-theme="dark"]{
  --bg:#141A18; --card:#1B2421; --card-2:#202A26;
  --text:#E6EDEA; --muted:#9CAFA8; --faint:#7A8C85;
  --primary:#7CBFA6; --on-primary:#10201B;
  --accent:#E8835A; --success:#6FBE8F; --warn:#D9A441; --danger:#E07A68;
  --border:rgba(230,237,234,.10); --border-2:rgba(230,237,234,.18);
  --track:rgba(230,237,234,.09);
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 6px 18px rgba(0,0,0,.26);
  --shadow-lg:0 12px 40px rgba(0,0,0,.46);
}
/* 强调色预设：teal(墨绿) / slate(靛蓝) / clay(赭石) / moss(苔绿) */
html[data-accent="slate"]{ --primary:#3A5A70; }
html[data-accent="clay"]{ --primary:#7A5540; }
html[data-accent="moss"]{ --primary:#4C6B3C; }
html[data-theme="dark"][data-accent="slate"]{ --primary:#7FA9C4; }
html[data-theme="dark"][data-accent="clay"]{ --primary:#C09572; }
html[data-theme="dark"][data-accent="moss"]{ --primary:#8FB47A; }

/* ==========================================================================
   2. 基础重置与排版
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
.num, .big-num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}

.muted{color:var(--muted)} .faint{color:var(--faint)}
.t-center{text-align:center} .right{text-align:right}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.gap4{gap:4px} .gap8{gap:8px} .gap12{gap:12px} .gap16{gap:16px}
.mt4{margin-top:4px} .mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mt24{margin-top:24px}
.mb8{margin-bottom:8px} .mb12{margin-bottom:12px}
.sm{font-size:12.5px} .xs{font-size:12px}
.bold{font-weight:600} .nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ==========================================================================
   3. 布局骨架：桌面侧栏 / 移动底栏
   ========================================================================== */
.app{display:flex;min-height:100dvh}
.sidebar{
  width:var(--nav-w); flex:0 0 var(--nav-w); position:sticky; top:0; height:100dvh;
  border-right:1px solid var(--border); padding:18px 12px; display:flex; flex-direction:column; gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{
  width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 34px;
}
.brand-t{font-weight:700;font-size:15px;letter-spacing:.3px}
.brand-s{font-size:11.5px;color:var(--faint)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:0 10px;height:42px;border-radius:var(--radius-sm);
  color:var(--muted);border:0;background:transparent;width:100%;text-align:left;font-size:14px;
  transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:var(--track);color:var(--text)}
.nav-item.active{background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);font-weight:600}
.nav-item .badge{margin-left:auto}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:grid;gap:8px}

.main{flex:1;min-width:0;max-width:1200px;margin:0 auto;padding:0 16px 40px;width:100%}
.tabbar{display:none}

.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0 10px;margin-bottom:2px;background:var(--bg);
  border-bottom:1px solid transparent;
}
.topbar.stuck{border-bottom-color:var(--border)}
.tb-title{font-size:15px;font-weight:700}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--muted);min-height:0;
}
.chip b{color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.chip.accent{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip.accent b{color:var(--accent)}
.icon-btn{
  width:34px;height:34px;min-height:0;border-radius:10px;border:1px solid var(--border);
  background:var(--card);display:grid;place-items:center;padding:0;
}
.icon-btn svg{width:17px;height:17px}

@media (max-width:899px){
  .sidebar{display:none}
  .main{padding:0 16px 84px;max-width:100%}
  .tabbar{
    display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:transparent;color:var(--faint);font-size:10.5px;padding:4px 0;min-height:52px;position:relative;
  }
  .tab svg{width:21px;height:21px}
  .tab.active{color:var(--primary)}
  .tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:6px;height:6px;border-radius:99px;background:var(--accent)}
}
@media (min-width:900px){ .tabbar{display:none} }

/* ==========================================================================
   4. 卡片与通用组件
   ========================================================================== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.tight{padding:12px}
.card.flat{box-shadow:none}
.hero{
  background:linear-gradient(135deg, color-mix(in srgb,var(--primary) 96%, #000), color-mix(in srgb,var(--primary) 78%, #000));
  color:#fff;border:0;position:relative;overflow:hidden;
}
html[data-theme="dark"] .hero{background:linear-gradient(135deg, color-mix(in srgb,var(--primary) 30%, var(--card)), var(--card));color:var(--text);border:1px solid var(--border)}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--accent) 32%, transparent)}
.big-num{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-1px}
.big-num small{font-size:15px;font-weight:500;margin-left:4px;opacity:.85}

.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.sec-title h3{font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.4px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:719px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} }

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:14px;font-weight:500;transition:filter .15s,background .15s,transform .06s;
}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--track)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:var(--radius-xs)}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:var(--radius-xs)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{
  min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
}
.fchip.on{background:color-mix(in srgb,var(--primary) 12%,transparent);border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary);font-weight:600}
.fchip.accent-on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-weight:600}

.badge{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  font-size:11px;font-weight:600;background:var(--track);color:var(--muted);
}
.badge.s,.badge.success{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.badge.a,.badge.accent{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.badge.w,.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#8A6A1E}
html[data-theme="dark"] .badge.warn{color:var(--warn)}
.badge.d,.badge.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.badge.p{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}

.dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px;display:inline-block}
.dot-lg{width:11px;height:11px;border-radius:99px;flex:0 0 11px}

.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .3s ease}
.bar.thin{height:5px}

/* ==========================================================================
   5. 表单
   ========================================================================== */
.field{display:grid;gap:6px;margin-bottom:12px}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
.field .hint{font-size:11.5px;color:var(--faint)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--border-2);border-radius:var(--radius-sm);
  background:var(--card);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;
}
textarea{min-height:80px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:9px;border:2px solid transparent;position:relative}
.swatch.on{border-color:var(--text)}
.checkline{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);cursor:pointer;min-height:48px;margin-bottom:8px}
.checkline input{margin-top:3px}
.checkline .t{font-weight:500;font-size:14px}

/* ==========================================================================
   6. 列表项 / 空状态
   ========================================================================== */
.li{
  display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);
  border-radius:12px;background:var(--card);margin-bottom:8px;min-height:52px;transition:border-color .15s;
}
.li:hover{border-color:var(--border-2)}
.li.done{opacity:.62}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.li .t{font-size:14px;font-weight:500;line-height:1.45}
.li .meta{font-size:11.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.li-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.cb{
  width:21px;height:21px;flex:0 0 21px;border:2px solid var(--border-2);border-radius:7px;background:transparent;
  display:grid;place-items:center;margin-top:1px;padding:0;transition:background .15s,border-color .15s;
}
.cb.on{background:var(--success);border-color:var(--success)}
.cb svg{width:12px;height:12px;color:#fff;opacity:0}
.cb.on svg{opacity:1}

.empty{
  text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--border-2);
  border-radius:var(--radius);background:var(--card-2);
}
.empty svg{width:64px;height:64px;opacity:.5;margin-bottom:8px}
.empty .t{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.empty .d{font-size:12.5px}

.divider{height:1px;background:var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}

.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .s{font-size:11px;color:var(--faint)}

/* ==========================================================================
   7. 番茄钟环形进度
   ========================================================================== */
.ring{position:relative;width:212px;height:212px;margin:6px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .circ{transition:stroke-dashoffset .35s linear}
.ring-inner{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ring-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.ring-sub{font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){ .ring{width:186px;height:186px} .ring-time{font-size:38px} }

/* ==========================================================================
   8. 热力图
   ========================================================================== */
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--track);display:block;cursor:pointer}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:block}
.week-labels{display:flex;gap:3px;margin-bottom:4px;font-size:10px;color:var(--faint);height:12px}
.week-labels span{width:13px;text-align:center;flex:0 0 13px}

/* ==========================================================================
   9. 周视图日历
   ========================================================================== */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{border:1px solid var(--border);border-radius:12px;padding:8px;min-height:132px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.wday.today{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 16%,transparent)}
.wday.drop-hint{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.wday-h{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.wtask{font-size:11.5px;padding:5px 7px;border-radius:8px;background:var(--card-2);border-left:3px solid var(--primary);cursor:grab;line-height:1.35}
.wtask.done{opacity:.55;text-decoration:line-through}
@media (max-width:760px){
  .week-grid{grid-template-columns:1fr;gap:8px}
  .wday{min-height:0}
}

/* ==========================================================================
   10. 遮罩 / 弹窗 / 提示条
   ========================================================================== */
.backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(20,26,24,.42);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media (min-width:700px){ .backdrop{align-items:center;padding:24px} }
.modal{
  background:var(--bg);border:1px solid var(--border);border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
  width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .18s ease;
}
@media (min-width:700px){ .modal{border-radius:16px;max-height:84dvh} }
@keyframes slideUp{from{transform:translateY(14px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15px;font-weight:700}
.modal-b{padding:14px 16px;overflow:auto;flex:1}
.modal-f{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card-2);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.modal-f .btn{flex:1}

.toast-root{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
@media (min-width:900px){ .toast-root{bottom:26px} }
.toast{
  background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;pointer-events:auto;animation:slideUp .18s ease;
}
.toast.ok{background:var(--success);color:#fff}
.toast.err{background:var(--danger);color:#fff}
.toast.warn{background:var(--warn);color:#20180A}
.toast button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:8px;padding:4px 10px;font-size:12.5px;min-height:0}

.banner{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;margin-bottom:12px;
  background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);
  font-size:13px;flex-wrap:wrap;
}
.banner svg{width:17px;height:17px;flex:0 0 17px;color:var(--warn)}
.banner.accent{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.banner.accent svg{color:var(--accent)}
.banner .btn{margin-left:auto}
.banner .btn + .btn{margin-left:0}

/* ==========================================================================
   11. 引导层
   ========================================================================== */
.onboarding{position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto}
.ob-wrap{max-width:520px;margin:0 auto;padding:24px 20px 40px;min-height:100dvh;display:flex;flex-direction:column}
.ob-step-bar{display:flex;gap:6px;margin:4px 0 22px}
.ob-step-bar i{flex:1;height:3px;border-radius:99px;background:var(--track)}
.ob-step-bar i.on{background:var(--primary)}
.ob-h h1{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px}
.ob-h p{color:var(--muted)}
.ob-body{flex:1;padding:20px 0}
.ob-foot{display:flex;gap:10px;align-items:center;padding-top:16px;border-top:1px solid var(--border)}

.view{display:none;animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.chart{width:100%;height:230px}
.chart-fallback{font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.chart-fallback .fr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--border);padding:5px 0}

.tree-node{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;overflow:hidden}
.tree-head{display:flex;align-items:center;gap:10px;padding:11px 12px;min-height:48px;flex-wrap:wrap}
.sub-points{border-top:1px dashed var(--border);padding:6px 12px 10px;background:var(--card-2)}
.point{display:flex;align-items:center;gap:9px;padding:7px 0;min-height:38px;font-size:13.5px}
.point .nm{flex:1;min-width:0}
.status-btn{
  min-height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--border-2);background:var(--card);
  font-size:11.5px;font-weight:600;color:var(--muted);
}
.status-btn[data-s="1"]{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);border-color:color-mix(in srgb,var(--success) 34%,transparent)}
.status-btn[data-s="0.5"]{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#8A6A1E;border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
html[data-theme="dark"] .status-btn[data-s="0.5"]{color:var(--warn)}

.fab{
  position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;line-height:1;
  display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 42%,transparent);
}
@media (min-width:900px){ .fab{bottom:28px;right:28px} }

<script>
/* ==========================================================================
   考研学习工作台 · 单文件应用
   模块：工具层 → 存储层 → 业务规则层 → 渲染层 → 交互层
   ========================================================================== */
(function () {
'use strict';

/* ---------------------------------------------------------------- 通用工具 */
var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function pad(n) { return String(n).padStart(2, '0'); }

/** 本地时区日期字符串 YYYY-MM-DD */
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
/** 解析 YYYY-MM-DD 为本地 00:00 */
function parseDay(s) {
  var p = String(s).split('-').map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}
/** 在 YYYY-MM-DD 上加减天数 */
function addDays(s, n) {
  var d = parseDay(s); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
/** b - a 相差天数 */
function diffDays(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
/** ISO 时间 → YYYY-MM-DD HH:mm */
function fmtDT(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
/** ISO 时间 → HH:mm */
function fmtHM(iso) { if (!iso) return ''; var d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
/** 分钟 → 中文时长 */
function fmtDur(m) {
  m = Math.max(0, Math.round(m || 0));
  var h = Math.floor(m / 60), r = m % 60;
  if (h && r) return h + ' 小时 ' + r + ' 分';
  if (h) return h + ' 小时';
  return r + ' 分';
}
function fmtDurShort(m) {
  m = Math.max(0, Math.round(m || 0));
  var h = Math.floor(m / 60), r = m % 60;
  return h ? h + 'h' + (r ? pad(r) + 'm' : '') : m + 'm';
}
/** YYYY-MM-DD → MM-DD */
function md(s) { return String(s).slice(5); }
var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
function weekCN(s) { return '周' + WEEK_CN[parseDay(s).getDay()]; }
/** ISO 周标识 YYYY-Www */
function weekKey(s) {
  var d = parseDay(s);
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 4 - (t.getDay() || 7));
  var y0 = new Date(t.getFullYear(), 0, 1);
  var wk = Math.ceil((((t - y0) / 86400000) + 1) / 7);
  return t.getFullYear() + '-W' + pad(wk);
}
function weekStart(s) { var d = parseDay(s); var off = (d.getDay() || 7) - 1; return addDays(s, -off); }
function uid(p) { return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function fmtClock(sec) { var m = Math.floor(sec / 60), s = sec % 60; return pad(m) + ':' + pad(s); }

/* ---------------------------------------------------------------- 图标 */
var ICONS = {
  today: '<path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/>',
  plan:  '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  focus: '<circle cx="12" cy="12.5" r="8.5"/><path d="M12 7.5v5.2l3.2 1.9"/>',
  book:  '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15.5H5.5A1.5 1.5 0 0 0 4 20z"/><path d="M4 20.5A1.5 1.5 0 0 1 5.5 19H19v2.5H5.5A1.5 1.5 0 0 1 4 20.5z"/>',
  error: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v6M12 16.2v.6"/>',
  stats: '<path d="M4 20.5V11M9.5 20.5V4M15 20.5v-6M20.5 20.5V8"/>',
  set:   '<circle cx="12" cy="12" r="3"/><path d="M19.2 14.6a1.5 1.5 0 0 0 .3 1.65l.05.06a1.8 1.8 0 1 1-2.55 2.55l-.06-.05a1.5 1.5 0 0 0-2.53 1.06v.17a1.8 1.8 0 1 1-3.6 0v-.09a1.5 1.5 0 0 0-2.53-1.06l-.06.05A1.8 1.8 0 1 1 5.67 16.4l.05-.06a1.5 1.5 0 0 0-1.06-2.53h-.17a1.8 1.8 0 1 1 0-3.6h.09a1.5 1.5 0 0 0 1.06-2.53l-.05-.06A1.8 1.8 0 1 1 8.14 5.07l.06.05a1.5 1.5 0 0 0 1.65.3h.08A1.5 1.5 0 0 0 11 3.84v-.17a1.8 1.8 0 1 1 3.6 0v.09a1.5 1.5 0 0 0 2.53 1.06l.06-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.06a1.5 1.5 0 0 0-.33 1.82v.08A1.5 1.5 0 0 0 21.16 11h.17a1.8 1.8 0 1 1 0 3.6h-.09a1.5 1.5 0 0 0-2.04-.03z"/>'
};
function icon(k, cls) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"' +
         (cls ? ' class="' + cls + '"' : '') + '>' + (ICONS[k] || '') + '</svg>';
}
var I_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
var I_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var I_EMPTY = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="21" opacity=".35"/><path d="M22 30h20M22 38h12" opacity=".45"/></svg>';

/* ---------------------------------------------------------------- 存储层 */
var PREFIX = 'kaoyan_';
var DB = {
  read: function (key, fb) {
    try {
      var raw = localStorage.getItem(PREFIX + key);
      if (raw === null || raw === undefined) return fb;
      return JSON.parse(raw);
    } catch (e) {
      toast('读取本地数据失败（' + key + '），已使用空数据', 'err');
      return fb;
    }
  },
  write: function (key, val) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); return true; }
    catch (e) { toast('写入失败：浏览器存储空间可能已满或被禁用', 'err'); return false; }
  },
  del: function (key) { try { localStorage.removeItem(PREFIX + key); } catch (e) {} }
};

/* ---------------------------------------------------------------- 常量与默认数据 */
var PALETTE = ['#2F5D50','#3A6EA5','#C9534A','#8A6D3B','#7A5C9E','#B0784C','#4C9A6B','#5B6B7A','#8C5A5A','#3F7C8C'];
var PRIORITIES = [
  { v: 1, label: '重要且紧急', cls: 'danger' },
  { v: 2, label: '重要不紧急', cls: 'accent' },
  { v: 3, label: '紧急不重要', cls: 'warn' },
  { v: 4, label: '不重要不紧急', cls: '' }
];
var Q_TYPES = ['单选','多选','判断','计算','简答','案例分析','其他'];
var REASONS = ['知识盲区','概念混淆','计算粗心','审题失误','方法不会','其他'];
var CHAPTER_STATUS = [{ v: 0, l: '未学' }, { v: 0.5, l: '学习中' }, { v: 1, l: '已掌握' }];
var EB_INTERVALS = [1, 2, 4, 7, 15];   // 艾宾浩斯复习间隔（天）

/** 距离今天最近的一场初试：当年 12 月倒数第二个周六，若已过则顺延到明年 */
function defaultExamDate() {
  function secondLastSat(y) {
    var sats = [], d = new Date(y, 11, 1), end = new Date(y, 11, 31);
    while (d <= end) { if (d.getDay() === 6) sats.push(d.getDate()); d.setDate(d.getDate() + 1); }
    return y + '-12-' + pad(sats[sats.length - 2]);
  }
  // 十四行诗：初试 2027 年 12 月（写死，不按当前年份推）
  return '2027-12-25';
}
function defaultPhases(exam) {
  return [
    { id: 'p1', name: '基础阶段', start: '03-01', end: '06-30', goal: '' },
    { id: 'p2', name: '强化阶段', start: '07-01', end: '09-30', goal: '' },
    { id: 'p3', name: '冲刺阶段', start: '10-01', end: '11-30', goal: '' },
    { id: 'p4', name: '模考点睛', start: '12-01', end: md(exam), goal: '' }
  ];
}
function defaultSubjects() {
  return [
    { id: 's1', name: '政治',   color: '#C9534A', sort: 1, chapters: [] },
    { id: 's2', name: '英语',   color: '#3A6EA5', sort: 2, chapters: [] },
    { id: 's3', name: '数学',   color: '#2F5D50', sort: 3, chapters: [] },
    { id: 's4', name: '专业课', color: '#8A6D3B', sort: 4, chapters: [] }
  ];
}

/* ---------------------------------------------------------------- 全局状态 */
var KEYMAP = {
  meta: 'meta', settings: 'settings', phases: 'phases', subjects: 'subjects',
  tasks: 'tasks', sessions: 'focus_sessions', mistakes: 'mistakes',
  checkins: 'checkins', reviews: 'reviews', papers: 'exam_papers'
};
var FM_KEY = 'focusstate';

var examDefault = defaultExamDate();
var S = {
  meta:     DB.read('meta', null),
  settings: DB.read('settings', { examDate: examDefault, school: '', major: '', dailyGoalMinutes: 300, theme: 'system', accentColor: 'teal' }),
  phases:   DB.read('phases', defaultPhases(examDefault)),
  subjects: DB.read('subjects', defaultSubjects()),
  tasks:    DB.read('tasks', []),
  sessions: DB.read('focus_sessions', []),
  mistakes: DB.read('mistakes', []),
  checkins: DB.read('checkins', {}),
  reviews:  DB.read('reviews', { daily: {}, weekly: {} }),
  papers:   DB.read('exam_papers', [])
};
if (!S.reviews || typeof S.reviews !== 'object') S.reviews = { daily: {}, weekly: {} };
if (!S.reviews.daily) S.reviews.daily = {};
if (!S.reviews.weekly) S.reviews.weekly = {};
if (!S.checkins || typeof S.checkins !== 'object') S.checkins = {};

function save(k) { DB.write(KEYMAP[k], S[k]); }
function saveAll() { Object.keys(KEYMAP).forEach(save); }

/* ---------------------------------------------------------------- 提示条 */
function toast(msg, kind, action) {
  var root = $('#toastRoot');
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = '<span class="grow">' + esc(msg) + '</span>';
  if (action) {
    var b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = function () { el.remove(); action.fn(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(function () { el.remove(); }, 260); }, action ? 6000 : 2600);
}

/* ---------------------------------------------------------------- 弹窗 */
var modalStack = [];
function openModal(opt) {
  var wrap = document.createElement('div');
  wrap.className = 'backdrop';
  wrap.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + esc(opt.title || '') + '</h3>' +
        (opt.closable === false ? '' : '<button class="icon-btn" data-close>✕</button>') +
      '</div>' +
      '<div class="modal-b">' + (opt.body || '') + '</div>' +
      '<div class="modal-f">' +
        (opt.buttons || '<button class="btn ghost" data-close>取消</button><button class="btn primary" data-ok>确定</button>') +
      '</div>' +
    '</div>';
  $('#modalRoot').appendChild(wrap);
  modalStack.push(wrap);

  function close() {
    wrap.remove();
    modalStack = modalStack.filter(function (x) { return x !== wrap; });
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape' && modalStack[modalStack.length - 1] === wrap) close(); }
  document.addEventListener('keydown', onKey);

  wrap.addEventListener('click', function (e) {
    if (e.target === wrap) { if (opt.closable !== false) close(); return; }
    if (e.target.closest('[data-close]')) { close(); return; }
    var ok = e.target.closest('[data-ok]');
    if (ok) {
      if (opt.onSubmit) {
        var r = opt.onSubmit(wrap);
        if (r !== false) close();
      } else close();
    }
  });
  if (opt.onMount) opt.onMount(wrap, close);
  if (window.matchMedia('(min-width: 700px)').matches) {
    var first = wrap.querySelector('input[type=text],textarea,select');
    if (first) setTimeout(function () { first.focus(); }, 60);
  }
  return { el: wrap, close: close };
}
/** 二次确认弹窗 */
function confirmBox(title, text, okText, danger) {
  return new Promise(function (res) {
    var done = false;
    var m = openModal({
      title: title,
      body: '<p class="muted">' + text + '</p>',
      buttons: '<button class="btn ghost" data-no>取消</button>' +
               '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-yes>' + esc(okText || '确定') + '</button>',
      onSubmit: function () {}
    });
    m.el.addEventListener('click', function (e) {
      if (e.target.closest('[data-yes]')) { if (!done) { done = true; res(true); } m.close(); }
      else if (e.target.closest('[data-no]')) { if (!done) { done = true; res(false); } m.close(); }
      else if (e.target === m.el) { if (!done) { done = true; res(false); } }
    });
  });
}
/** 二选一弹窗 */
function choiceBox(title, html, buttons) {
  return new Promise(function (res) {
    var bstr = buttons.map(function (b, i) {
      return '<button class="btn ' + (b.cls || 'ghost') + '" data-choice="' + i + '">' + esc(b.label) + '</button>';
    }).join('');
    var m = openModal({ title: title, body: html, buttons: bstr });
    m.el.addEventListener('click', function (e) {
      var c = e.target.closest('[data-choice]');
      if (c) { res(Number(c.getAttribute('data-choice'))); m.close(); }
      else if (e.target === m.el) { res(-1); }
    });
  });
}

function val(id) { var e = document.getElementById(id); return e ? String(e.value).trim() : ''; }

/* ==========================================================================
   业务规则层（所有统计数字均由此处实时计算，禁止写死）
   ========================================================================== */

/** 规则1：倒计时天数 = ceil((考试日 00:00 - 现在)/一天)；当天为 0，之后为负 */
function daysToExam() {
  if (!S.settings.examDate) return null;
  var examMidnight = parseDay(S.settings.examDate).getTime();
  return Math.ceil((examMidnight - Date.now()) / 86400000);
}
/** 规则2：当前复习阶段判定（按 MM-DD 比较，支持跨年区间） */
function currentPhase() {
  var t = md(todayStr());
  for (var i = 0; i < S.phases.length; i++) {
    var p = S.phases[i];
    var ok = p.start <= p.end ? (t >= p.start && t <= p.end) : (t >= p.start || t <= p.end);
    if (ok) return p;
  }
  return null;
}
/** 规则3：自动打卡 */
function autoCheckin(dateKey) {
  if (S.checkins[dateKey]) return;
  S.checkins[dateKey] = true;
  save('checkins');
}
/** 规则4：连续打卡（今天未打卡时从昨天起算） */
function streakDays() {
  var d = new Date(), c = 0;
  if (!S.checkins[todayStr(d)]) d.setDate(d.getDate() - 1);
  while (S.checkins[todayStr(d)]) { c++; d.setDate(d.getDate() - 1); }
  return c;
}
function longestStreak() {
  var keys = Object.keys(S.checkins).sort();
  var best = 0, cur = 0, prev = null;
  keys.forEach(function (k) {
    if (!S.checkins[k]) return;
    if (prev && diffDays(prev, k) === 1) cur++; else cur = 1;
    prev = k; if (cur > best) best = cur;
  });
  return best;
}
/** 规则5：科目进度 = Σ知识点权重 / 知识点总数 */
function subjectProgress(sub) {
  var total = 0, sum = 0;
  (sub.chapters || []).forEach(function (c) {
    if (c.status != null) { total++; sum += Number(c.status); }
    (c.points || []).forEach(function (p) { total++; sum += Number(p.status || 0); });
  });
  return { total: total, mastered: Math.round(sum), ratio: total ? Math.round(sum / total * 1000) / 10 : 0 };
}
function subjectMinutes(subId) {
  return S.sessions.reduce(function (a, s) { return a + (s.subjectId === subId ? (s.durationMinutes || 0) : 0); }, 0);
}
/** 规则7：任务完成率 */
function taskRate() {
  if (!S.tasks.length) return null;
  var done = S.tasks.filter(function (t) { return t.status === 'done'; }).length;

/* ==========================================================================
   番茄钟（基于时间戳差值，切后台 / 锁屏 / 刷新均不失真）
   ========================================================================== */
var FS = DB.read(FM_KEY, null) || {
  phase: 'idle',           // idle | running | paused | rest-suggest
  type: 'focus',           // focus | rest
  mode: 'countdown',       // countdown | countup
  targetMs: 25 * 60000,
  startAt: 0,              // 本段计时起点
  firstStartAt: 0,         // 首次开始时间（用于写入记录）
  elapsed: 0,              // 已累计毫秒（暂停时合并）
  taskId: '', subjectId: '',
  noise: 'off',
  lastTaskId: '', lastSubjectId: '', lastMinutes: 25
};
function fsSave() { DB.write(FM_KEY, FS); }

/** 当前已流逝毫秒数（含暂停累计） */
function elapsedMs() {
  if (FS.phase === 'running') return FS.elapsed + (Date.now() - FS.startAt);
  return FS.elapsed;
}
function remainingMs() { return Math.max(0, FS.targetMs - elapsedMs()); }

function startTimer(type, minutes, mode, taskId, subjectId) {
  var now = Date.now();
  FS.type = type; FS.mode = mode || 'countdown';
  FS.targetMs = (minutes || 25) * 60000;
  FS.startAt = now; FS.firstStartAt = now; FS.elapsed = 0;
  FS.phase = 'running';
  FS.taskId = taskId || ''; FS.subjectId = subjectId || '';
  if (type === 'focus') { FS.lastTaskId = FS.taskId; FS.lastSubjectId = FS.subjectId; FS.lastMinutes = minutes; }
  fsSave(); renderFocus(); startTicking(); updateTitle();
}
function pauseTimer() { if (FS.phase !== 'running') return; FS.elapsed += Date.now() - FS.startAt; FS.phase = 'paused'; fsSave(); renderFocus(); updateTitle(); }
function resumeTimer() { if (FS.phase !== 'paused') return; FS.startAt = Date.now(); FS.phase = 'running'; fsSave(); renderFocus(); startTicking(); updateTitle(); }

var tickId = null;
function startTicking() { stopTicking(); tickId = setInterval(tick, 500); tick(); }
function stopTicking() { if (tickId) { clearInterval(tickId); tickId = null; } }
function tick() {
  if (FS.phase === 'running') {
    if (FS.mode === 'countdown' && remainingMs() <= 0) { autoFinish(); return; }
    renderRing();
    updateTitle();
    fsSave();
  }
}
function updateTitle() {
  var base = '考研学习工作台';
  if (FS.phase === 'running') {
    var sec = Math.ceil((FS.mode === 'countdown' ? remainingMs() : elapsedMs()) / 1000);
    document.title = fmtClock(sec) + ' · ' + (FS.type === 'focus' ? '专注中' : '休息中') + ' | ' + base;
  } else if (FS.phase === 'paused') {
    document.title = '已暂停 | ' + base;
  } else { document.title = base; }
}
function progressRatio() {
  if (FS.mode === 'countup') return clamp(elapsedMs() / 3600000, 0, 1);
  return FS.targetMs ? clamp(elapsedMs() / FS.targetMs, 0, 1) : 0;
}
/** 倒计时自然归零：完整记录 + 建议休息 */
function autoFinish() {
  FS.elapsed = FS.targetMs;
  if (FS.type === 'focus') {
    recordSession({
      taskId: FS.taskId, subjectId: FS.subjectId, minutes: Math.round(FS.targetMs / 60000),
      startAt: new Date(FS.firstStartAt).toISOString(), endAt: new Date(FS.firstStartAt + FS.elapsed).toISOString(),
      completed: true, mode: 'countdown'
    });
    toast('完成一个番茄 🍅 ' + Math.round(FS.targetMs / 60000) + ' 分钟', 'ok');
    FS.phase = 'rest-suggest';
  } else {
    toast('休息结束，开始下一个吧', 'ok');
    FS.phase = 'idle';
  }
  FS.elapsed = 0;
  fsSave(); stopTicking(); updateTitle();
  renderAll();
}
/** 手动提前结束：让用户选择记录实际时长 / 放弃 */
function stopEarly() {
  if (FS.phase === 'running') FS.elapsed += Date.now() - FS.startAt;
  var ms = FS.elapsed, minutes = Math.floor(ms / 60000);
  var wasFocus = FS.type === 'focus';
  FS.phase = 'idle'; stopTicking(); updateTitle();
  if (!wasFocus) { FS.elapsed = 0; fsSave(); renderAll(); return; }
  if (minutes < 1) {
    FS.elapsed = 0; fsSave(); renderAll();
    toast('本次不足 1 分钟，未记录', 'warn');
    return;
  }
  choiceBox('结束本次专注',
    '<p class="muted">已经专注 <b class="bold">' + fmtDur(minutes) + '</b>' +
    (FS.taskId ? '（' + esc(taskTitle(FS.taskId)) + '）' : '') + '。</p>' +
    '<p class="muted sm mt8">距离目标 ' + Math.round(FS.targetMs / 60000) + ' 分钟还差一些，要不要把这段真实时长记下来？</p>',
    [{ label: '按实际时长记录', cls: 'primary' }, { label: '放弃本次记录', cls: 'ghost' }]
  ).then(function (idx) {
    if (idx === 0) {
      recordSession({
        taskId: FS.taskId, subjectId: FS.subjectId, minutes: minutes,
        startAt: new Date(FS.firstStartAt).toISOString(), endAt: new Date(FS.firstStartAt + ms).toISOString(),
        completed: false, mode: FS.mode
      });
      toast('已记录 ' + fmtDur(minutes) + '（不完整）', 'ok');
    }
    FS.elapsed = 0; fsSave();
    renderAll();
  });
}

/* 白噪音：WebAudio 合成，无外部音源版权问题 */
var audioCtx = null, noiseNode = null, noiseGain = null;
function toggleNoise(kind) {
  if (kind === 'off' || kind === FS.noise) {
    stopNoise(); FS.noise = 'off'; fsSave(); renderView('focus'); return;
  }
  stopNoise();
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { toast('当前浏览器不支持音频播放', 'warn'); return; }
    audioCtx = audioCtx || new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var len = audioCtx.sampleRate * 2;
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {
      var white = Math.random() * 2 - 1;
      if (kind === 'rain') { last = (last + 0.02 * white) / 1.02; data[i] = last * 3.2; }
      else data[i] = white * 0.25;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buf; noiseNode.loop = true;
    var filter = audioCtx.createBiquadFilter();
    filter.type = kind === 'rain' ? 'bandpass' : 'lowpass';
    filter.frequency.value = kind === 'rain' ? 1400 : 6000;
    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = kind === 'rain' ? 0.24 : 0.14;
    noiseNode.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    noiseNode.start();
    FS.noise = kind; fsSave(); renderView('focus');
    toast('已开启' + (kind === 'rain' ? '雨声' : '白噪声'));
  } catch (e) { toast('音频播放失败：' + e.message, 'err'); }
}
function stopNoise() {
  try { if (noiseNode) { noiseNode.stop(); noiseNode.disconnect(); } } catch (e) {}
  noiseNode = null; noiseGain = null;
}

        '<span class="badge ' + p.cls + '">' + p.label + '</span>' +
        '<span>🍅 ' + (t.estimatedPomodoros || 1) + '</span>' +

}

/* ------------------------------------------------------------- 视图：计划 */
function renderPlan() {
  var html = '';
  html += '<div class="row between">' +
    '<div class="chips"><button class="fchip' + (UI.planMode === 'day' ? ' on' : '') + '" data-act="plan-mode" data-m="day">日视图</button>' +
    '<button class="fchip' + (UI.planMode === 'week' ? ' on' : '') + '" data-act="plan-mode" data-m="week">周视图</button></div>' +
    '<button class="btn primary sm" data-act="add-task" data-date="' + UI.planDate + '">' + I_PLUS + ' 新建任务</button>' +
  '</div>';

  if (UI.planMode === 'day') {
    html += '<div class="row between mt12">' +
      '<button class="icon-btn" data-act="day-move" data-n="-1">‹</button>' +
      '<div class="t-center grow"><div class="bold">' + UI.planDate + ' ' + weekCN(UI.planDate) + '</div>' +
      '<div class="xs faint">' + (UI.planDate === todayStr() ? '今天' : '距今天 ' + diffDays(todayStr(), UI.planDate) + ' 天') + '</div></div>' +
      '<button class="icon-btn" data-act="day-move" data-n="1">›</button>' +
    '</div>';
    var list = S.tasks.filter(function (t) { return t.date === UI.planDate; })
      .sort(function (a, b) { return ((a.status === 'done') - (b.status === 'done')) || (a.priority - b.priority); });

      '<button class="icon-btn" data-act="week-move" data-n="-7">‹</button>' +
      '<div class="t-center grow"><div class="bold">' + ws + ' ~ ' + addDays(ws, 6) + '</div>' +
      '<div class="xs faint">' + weekKey(ws) + (weekKey(ws) === weekKey(todayStr()) ? ' · 本周' : '') + '</div></div>' +
      '<button class="icon-btn" data-act="week-move" data-n="7">›</button>' +
    '</div>';
    html += '<div class="week-grid mt12">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i);
      var dl = S.tasks.filter(function (t) { return t.date === d; })
        .sort(function (a, b) { return a.priority - b.priority; });
      html += '<div class="wday' + (d === todayStr() ? ' today' : '') + '" data-dropday="' + d + '">' +
        '<div class="wday-h"><span class="bold">' + pad(parseDay(d).getMonth() + 1) + '/' + pad(parseDay(d).getDate()) + '</span>' +
        '<span>' + WEEK_CN[parseDay(d).getDay()] + '</span></div>' +
        dl.map(function (t) {
          return '<div class="wtask' + (t.status === 'done' ? ' done' : '') + '" draggable="true" data-drag-task="' + t.id + '" ' +
            'style="border-left-color:' + subColor(t.subjectId) + '" ' +
            'data-act="edit-task" data-id="' + t.id + '">' + esc(t.title) + '</div>';
        }).join('') +
        '<button class="btn ghost xs mt4" data-act="add-task" data-date="' + d + '">+ 添加</button>' +
      '</div>';
    }
    html += '</div><div class="xs faint mt8">提示：可拖动任务卡片到其他日期完成顺延。</div>';
  }

  /* 阶段规划时间轴 */
  var cp = currentPhase();
  html += '<div class="sec-title"><h3>复习阶段</h3><span class="xs faint">当前：' + (cp ? cp.name : '未安排') + '</span></div>';
  html += '<div class="grid g2">';
  S.phases.forEach(function (p) {
    var isCur = cp && cp.id === p.id;
    html += '<div class="card tight" style="' + (isCur ? 'border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 14%,transparent)' : '') + '">' +
      '<div class="row between"><div class="row gap8">' +
        '<span class="dot-lg" style="background:' + (isCur ? 'var(--accent)' : 'var(--border-2)') + '"></span>' +
        '<span class="bold">' + esc(p.name) + '</span>' +
        (isCur ? '<span class="badge a">进行中</span>' : '') +
      '</div><span class="xs faint nowrap">' + p.start + ' ~ ' + p.end + '</span></div>' +
      '<div class="sm muted mt4">' + esc(p.goal || '未填写阶段目标') + '</div>' +
      '<div class="row gap8 mt8"><button class="btn ghost xs" data-act="edit-phase" data-id="' + p.id + '">编辑目标与日期</button></div>' +
    '</div>';
  });
  html += '</div>';

  /* 周复盘 */
  var wk = weekKey(UI.planWeek), wr = S.reviews.weekly[wk] || { summary: '', weakness: '', nextWeek: '' };
  var history = Object.keys(S.reviews.weekly).sort().reverse();
  html += '<div class="sec-title"><h3>周复盘 · ' + wk + '</h3>' +
    (history.length > 1 ? '<select id="wkPicker" data-act="pick-week" style="min-height:32px;width:auto"><option value="">历史复盘…</option>' +
      history.map(function (k) { return '<option value="' + k + '"' + (k === wk ? ' selected' : '') + '>' + k + '</option>'; }).join('') +
    '</select>' : '') + '</div>';
  html += '<div class="card">' +
    '<div class="field"><label>本周完成情况</label><textarea id="wr_summary">' + esc(wr.summary) + '</textarea></div>' +
    '<div class="field"><label>薄弱点</label><textarea id="wr_weakness">' + esc(wr.weakness) + '</textarea></div>' +
    '<div class="field"><label>下周计划</label><textarea id="wr_next">' + esc(wr.nextWeek) + '</textarea></div>' +
    '<button class="btn primary block" data-act="save-weekly-review">保存周复盘</button>' +
  '</div>';
  return html;
}

/* ------------------------------------------------------------- 视图：专注 */
function renderFocus() {
  if (FS.phase === 'idle' || FS.phase === 'rest-suggest') return renderFocusSetup();
  return renderFocusRunning();
}
function noiseBar() {
  return '<div class="row gap8 mt12 wrap" style="justify-content:center">' +
    '<span class="xs faint">氛围音</span>' +
    '<button class="fchip' + (FS.noise === 'rain' ? ' accent-on' : '') + '" data-act="noise" data-k="rain">🌧 雨声</button>' +
    '<button class="fchip' + (FS.noise === 'white' ? ' accent-on' : '') + '" data-act="noise" data-k="white">白噪声</button>' +
    (FS.noise && FS.noise !== 'off' ? '<button class="fchip" data-act="noise" data-k="off">关闭</button>' : '') +
  '</div>';
}
function renderFocusSetup() {
  var html = '';
  if (FS.phase === 'rest-suggest') {
    var cnt = S.sessions.filter(function (s) { return String(s.startAt).slice(0, 10) === todayStr() && s.completed; }).length;
    var restMin = (cnt > 0 && cnt % 4 === 0) ? 15 : 5;
    html += '<div class="banner accent">' + icon('focus') +
      '<span class="grow">已完成今日第 ' + cnt + ' 个番茄，休息 ' + restMin + ' 分钟再战（每 4 个番茄一次长休息）</span></div>' +
      '<div class="card t-center">' +
        '<div class="bold">该休息一下了</div>' +
        '<div class="sm muted mt4">走动、喝水、远眺，别刷手机</div>' +
        '<div class="row gap8 mt12" style="justify-content:center">' +
          '<button class="btn primary" data-act="start-rest" data-m="' + restMin + '">开始休息 ' + restMin + ' 分钟</button>' +
          '<button class="btn ghost" data-act="skip-rest">跳过休息</button>' +
        '</div>' +
        '<div class="mt8"><button class="btn ghost xs" data-act="new-focus">直接开始下一个番茄</button></div>' +
      '</div>';
    return html + sessionListHTML();
  }

  var mins = FS.lastMinutes || 25;
  var quick = [25, 45, 60, 90];
  var tasks = S.tasks.filter(function (t) { return t.status !== 'done'; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 40);
  html += '<div class="card">' +
    '<div class="chips" style="justify-content:center">' +
      '<button class="fchip' + (FS.mode === 'countdown' ? ' on' : '') + '" data-act="fmode" data-m="countdown">倒计时</button>' +
      '<button class="fchip' + (FS.mode === 'countup' ? ' on' : '') + '" data-act="fmode" data-m="countup">正计时</button>' +
    '</div>';
  if (FS.mode === 'countdown') {
    html += '<div class="row gap8 mt12 wrap" style="justify-content:center">' +
      quick.map(function (q) { return '<button class="fchip' + (q === mins ? ' accent-on' : '') + '" data-act="pick-min" data-m="' + q + '">' + q + ' 分</button>'; }).join('') +
      '</div>' +
      '<div class="field mt12" style="max-width:220px;margin-left:auto;margin-right:auto"><label class="t-center" style="text-align:center">自定义时长（5–180 分钟）</label>' +
      '<input type="number" id="fCustom" min="5" max="180" value="' + mins + '"></div>';
  } else {
    html += '<div class="t-center sm muted mt12">正计时模式：点开始后持续累计，结束时按实际时长记录。</div>';
  }
  html += '<div class="ring">' + ringSVG(0) +
    '<div class="ring-inner"><div class="ring-time num">' + (FS.mode === 'countdown' ? mins + '<span style="font-size:16px"> 分</span>' : '00:00') + '</div>' +
    '<div class="ring-sub">准备开始</div></div></div>';

  html += '<div class="field"><label>关联任务（可选）</label><select id="fTask">' +
    '<option value="">不关联任务</option>' +
    tasks.map(function (t) {
      return '<option value="' + t.id + '"' + (t.id === FS.lastTaskId ? ' selected' : '') + '>' +
        esc(t.title) + ' · ' + t.date.slice(5) + ' · ' + esc(subName(t.subjectId)) + '</option>';
    }).join('') + '</select></div>';
  html += '<div class="field"><label>计入科目</label><select id="fSubject">' +
    '<option value="">不指定科目</option>' +
    S.subjects.map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === FS.lastSubjectId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('') + '</select></div>';
  html += '<button class="btn accent block" data-act="start-focus">▶ 开始专注</button>';
  html += noiseBar();
  html += '</div>';
  html += sessionListHTML();
  return html;
}
function sessionListHTML() {
  var t = todayStr();
  var list = S.sessions.filter(function (s) { return String(s.startAt).slice(0, 10) === t; })
    .sort(function (a, b) { return a.startAt < b.startAt ? 1 : -1; });
  var total = list.reduce(function (a, s) { return a + s.durationMinutes; }, 0);
  var html = '<div class="sec-title"><h3>今日专注记录</h3><span class="xs faint">' + list.length + ' 次 · ' + fmtDur(total) + '</span></div>';
  if (!list.length) return html + '<div class="card flat">' + emptyArt('今天还没有专注记录', '开始一个番茄，数据才会生长') + '</div>';
  html += list.map(function (s) {
    return '<div class="li">' +
      '<span class="dot" style="background:' + subColor(s.subjectId) + ';margin-top:6px"></span>' +
      '<div class="grow"><div class="t">' + fmtHM(s.startAt) + ' – ' + fmtHM(s.endAt) +
        ' <span class="muted sm">· ' + fmtDur(s.durationMinutes) + '</span></div>' +
        '<div class="meta">' + esc(subName(s.subjectId)) +
        (s.taskId && taskById(s.taskId) ? ' · ' + esc(taskTitle(s.taskId)) : '') +
        (s.completed ? '' : ' <span class="badge w">不完整</span>') +
        (s.mode === 'countup' ? ' <span class="badge">正计时</span>' : '') +
        '</div></div>' +
      '<div class="li-actions"><button class="btn ghost xs" data-act="del-session" data-id="' + s.id + '">删除</button></div>' +
    '</div>';
  }).join('');
  return html;
}
function renderFocusRunning() {
  var isRest = FS.type === 'rest';
  var ms = FS.mode === 'countdown' ? remainingMs() : elapsedMs();
  var totalSec = Math.ceil(ms / 1000);
  var color = isRest ? 'var(--success)' : 'var(--primary)';
  var html = '<div class="card t-center">' +
    '<div class="row between"><span class="badge ' + (isRest ? 's' : 'p') + '">' + (isRest ? '休息中' : '专注中') + '</span>' +
      '<span class="xs faint">' + fmtDT(new Date(FS.firstStartAt).toISOString()) + ' 开始</span></div>' +
    '<div class="ring">' + ringSVG(progressRatio(), color) +
      '<div class="ring-inner">' +
        '<div class="ring-time num" id="ringTime">' + fmtClock(totalSec) + '</div>' +
        '<div class="ring-sub">' + (isRest ? '闭目养神会儿' : (esc(taskTitle(FS.taskId)) || esc(subName(FS.subjectId)) || '保持专注')) + '</div>' +
      '</div></div>' +
    '<div class="row gap8" style="justify-content:center">' +
      (FS.phase === 'running'
        ? '<button class="btn primary" data-act="pause-focus">暂停</button><button class="btn ghost" data-act="stop-focus">提前结束</button>'
        : '<button class="btn primary" data-act="resume-focus">继续</button><button class="btn ghost" data-act="stop-focus">结束并结算</button>') +
    '</div>' +
    '<div class="mt8 xs faint">目标 ' + Math.round(FS.targetMs / 60000) + ' 分钟 · 已进行 ' + fmtDur(Math.round(elapsedMs() / 60000)) + '</div>' +
    noiseBar() +
  '</div>';
  html += sessionListHTML();
  return html;
}
function renderRing() {
  var timeEl = document.getElementById('ringTime');
  if (!timeEl) return;
  var ms = FS.mode === 'countdown' ? remainingMs() : elapsedMs();
  timeEl.textContent = fmtClock(Math.ceil(ms / 1000));
  var svgEl = document.querySelector('#view-focus .ring svg .circ');
  if (svgEl) {
    var r = 92, C = 2 * Math.PI * r;
    svgEl.setAttribute('stroke-dashoffset', (C * (1 - progressRatio())).toFixed(1));
  }
}

/* ------------------------------------------------------------- 视图：科目 */
function renderSubject() {
  var html = '<div class="row between">' +
    '<div class="sm muted">共 ' + S.subjects.length + ' 个科目 · 点击卡片展开章节</div>' +
    '<button class="btn primary sm" data-act="add-subject">' + I_PLUS + ' 新增科目</button></div>';

  if (!S.subjects.length) {
    return html + '<div class="card flat mt12">' + emptyArt('还没有科目', '先添加政治 / 英语 / 数学 / 专业课，之后所有统计都围绕科目展开') + '</div>';
  }
  html += '<div class="grid g2 mt12">';
  S.subjects.forEach(function (s) {
    var p = subjectProgress(s);
    var mins = subjectMinutes(s.id);
    var open = UI.subjectOpen === s.id;
    html += '<div class="card">' +
      '<div class="row between" data-act="toggle-subject" data-id="' + s.id + '" style="cursor:pointer">' +
        '<div class="row gap8"><span class="dot-lg" style="background:' + s.color + '"></span>' +
          '<span class="bold">' + esc(s.name) + '</span></div>' +
        '<span class="badge ' + (p.ratio >= 100 ? 's' : 'p') + '">' + p.ratio + '%</span>' +
      '</div>' +
      '<div class="bar mt8"><i style="width:' + p.ratio + '%;background:' + s.color + '"></i></div>' +
      '<div class="row between xs faint mt4"><span>' + p.mastered + ' / ' + p.total + ' 知识点</span><span>累计 ' + fmtDur(mins) + '</span></div>' +
      (p.total === 0 ? '<div class="xs faint mt4">进度为 0% · 去添加章节</div>' : '') +
      '<div class="row gap8 mt8">' +
        '<button class="btn ghost xs" data-act="add-chapter" data-id="' + s.id + '">+ 章节</button>' +
        '<button class="btn ghost xs" data-act="edit-subject" data-id="' + s.id + '">编辑</button>' +
        '<div class="grow"></div>' +
        '<button class="btn ghost xs" data-act="toggle-subject" data-id="' + s.id + '">' + (open ? '收起' : '展开') + '</button>' +
      '</div>';
    if (open) html += '<div class="mt8">' + chaptersHTML(s) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function chaptersHTML(sub) {
  if (!sub.chapters.length) return emptyArt('还没有章节', '按教材目录建章，再拆到知识点');
  return sub.chapters.map(function (c) {
    var stTxt = CHAPTER_STATUS.filter(function (x) { return x.v === Number(c.status); })[0] || CHAPTER_STATUS[0];
    return '<div class="tree-node">' +
      '<div class="tree-head">' +
        '<span class="badge ' + (Number(c.status) === 1 ? 's' : Number(c.status) === 0.5 ? 'w' : '') + '" ' +
          'data-act="cycle-chapter" data-sub="' + sub.id + '" data-id="' + c.id + '" style="cursor:pointer" title="点击切换状态">' + stTxt.l + '</span>' +
        '<span class="bold grow">' + esc(c.name) + '</span>' +
        '<button class="btn ghost xs" data-act="add-point" data-sub="' + sub.id + '" data-id="' + c.id + '">+ 知识点</button>' +
        '<button class="btn ghost xs" data-act="move-chapter" data-sub="' + sub.id + '" data-id="' + c.id + '" data-d="-1">↑</button>' +
        '<button class="btn ghost xs" data-act="move-chapter" data-sub="' + sub.id + '" data-id="' + c.id + '" data-d="1">↓</button>' +
        '<button class="btn ghost xs" data-act="del-chapter" data-sub="' + sub.id + '" data-id="' + c.id + '">✕</button>' +
      '</div>' +
      ((c.points && c.points.length) ? '<div class="sub-points">' + c.points.map(function (p) {
        var ps = CHAPTER_STATUS.filter(function (x) { return x.v === Number(p.status); })[0] || CHAPTER_STATUS[0];
        return '<div class="point"><span class="dot" style="background:' + sub.color + '"></span>' +
          '<span class="nm">' + esc(p.name) + '</span>' +
          '<button class="status-btn" data-s="' + p.status + '" data-act="cycle-point" data-sub="' + sub.id + '" data-c="' + c.id + '" data-id="' + p.id + '">' + ps.l + '</button>' +
          '<button class="btn ghost xs" data-act="del-point" data-sub="' + sub.id + '" data-c="' + c.id + '" data-id="' + p.id + '">✕</button>' +
        '</div>';
      }).join('') + '</div>' : '') +
    '</div>';
  }).join('');
}

/* ------------------------------------------------------------- 视图：错题 */
function renderMistake() {
  var all = S.mistakes;
  var due = dueList();
  var mr = masteryRate();
  var html = '<div class="grid g3">' +
    statCard(String(due.length), '待复习', '今天到期') +
    statCard(mr ? mr.mastered + '/' + mr.total : '—', '已掌握', mr ? '掌握率 ' + mr.rate + '%' : '暂无错题') +

  html += '<div class="row between mt12 wrap">' +
    '<div class="chips">' +
      '<button class="fchip' + (UI.mistakeTab === 'due' ? ' on' : '') + '" data-act="mtab" data-t="due">待复习' + (due.length ? ' ' + due.length : '') + '</button>' +
      '<button class="fchip' + (UI.mistakeTab === 'all' ? ' on' : '') + '" data-act="mtab" data-t="all">全部</button>' +
      '<button class="fchip' + (UI.mistakeTab === 'mastered' ? ' on' : '') + '" data-act="mtab" data-t="mastered">已掌握</button>' +
    '</div>' +
    '<button class="btn primary sm" data-act="add-mistake">' + I_PLUS + ' 记一道</button>' +
  '</div>';

  html += '<div class="row gap8 mt12 wrap">' +
    '<input type="text" id="mq" placeholder="搜索题干或标签…" value="' + esc(UI.mistakeQ) + '" style="max-width:220px;min-height:38px">' +
    '<select id="msub" style="max-width:140px;min-height:38px"><option value="">全部科目</option>' +
      S.subjects.map(function (s) { return '<option value="' + s.id + '"' + (UI.mistakeSub === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select>' +
    '<select id="mreason" style="max-width:130px;min-height:38px"><option value="">全部原因</option>' +
      REASONS.map(function (r) { return '<option value="' + r + '"' + (UI.mistakeReason === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' +
    '<select id="msort" style="max-width:150px;min-height:38px">' +
      '<option value="next"' + (UI.mistakeSort === 'next' ? ' selected' : '') + '>按复习时间</option>' +
      '<option value="new"' + (UI.mistakeSort === 'new' ? ' selected' : '') + '>按创建时间</option>' +
    '</select>' +
  '</div>';

  var list = filterMistakes();
  if (!all.length) return html + '<div class="card flat mt12">' + emptyArt('还没有错题', '刷错的每一道题都是提分项，点击右上角 + 记录第一道') + '</div>';
  html += '<div class="mt12">' + (list.length ? list.map(mistakeItem).join('') :
    '<div class="card flat">' + emptyArt('没有符合条件的错题', '换个筛选条件试试') + '</div>') + '</div>';
  return html;
}
function filterMistakes() {
  var t = todayStr();
  var q = UI.mistakeQ.toLowerCase();
  return S.mistakes.filter(function (m) {
    if (UI.mistakeTab === 'due') { if (m.status !== 'reviewing' || !m.nextReviewAt || m.nextReviewAt > t) return false; }
    if (UI.mistakeTab === 'mastered' && m.status !== 'mastered') return false;
    if (UI.mistakeSub && m.subjectId !== UI.mistakeSub) return false;
    if (UI.mistakeReason && m.reason !== UI.mistakeReason) return false;

function heatColor(level) {
  var c = ['var(--track)',
    'color-mix(in srgb, var(--primary) 26%, var(--track))',
    'color-mix(in srgb, var(--primary) 52%, var(--track))',
    'color-mix(in srgb, var(--primary) 74%, var(--track))',
    'var(--primary)'];
  return c[clamp(level, 0, 4)];
}
/** 规则9：强度分档 0 / 1-30 / 31-60 / 61-120 / 120+ */
function heatLevel(min) {
  if (!min) return 0;
  if (min <= 30) return 1;
  if (min <= 60) return 2;
  if (min <= 120) return 3;
  return 4;
}
function heatHTML() {
  var back = new Date(); back.setDate(back.getDate() - (26 * 7 - 1));
  var start = new Date(back.getFullYear(), back.getMonth(), back.getDate());
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // 对齐到周一
  var cells = [], months = [];
  var cur = new Date(start.getTime());
  var lastMonth = -1, now = new Date();
  while (cur <= now) {
    var key = todayStr(cur);
    var min = minutesOn(key);
    cells.push('<i title="' + key + ' · ' + min + ' 分钟" style="background:' + heatColor(heatLevel(min)) +
      '" data-act="day-brief" data-d="' + key + '"></i>');
    var m = cur.getMonth();
    if (m !== lastMonth) { months.push({ idx: cells.length - 1, m: m + 1 }); lastMonth = m; }
    cur.setDate(cur.getDate() + 1);
  }
  while (cells.length % 7 !== 0) cells.push('<i style="background:transparent;cursor:default"></i>');
  var weeks = cells.length / 7;
  var labels = '';
  for (var w = 0; w < weeks; w++) {
    var lab = '';
    months.forEach(function (o) { if (Math.floor(o.idx / 7) === w) lab = o.m + '月'; });
    labels += '<span>' + lab + '</span>';
  }
  return '<div class="heat-wrap"><div class="week-labels">' + labels + '</div><div class="heat">' + cells.join('') + '</div></div>';
}

        '<div class="kv"><span class="k">占用空间</span><span class="num">' + storageSize() + '</span></div>' +
      '</div>' +
    '</div>';

  html += '<div class="sec-title"><h3>关于</h3></div>' +
    '<div class="card">' +
      '<div class="kv"><span class="k">版本</span><b>1.0.0</b></div>' +

function storageSize() {
  var n = 0;
  Object.keys(KEYMAP).forEach(function (k) {
    try { var v = localStorage.getItem(PREFIX + KEYMAP[k]); if (v) n += v.length; } catch (e) {}
  });
  return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
}

/* ---------------------------------------------------------------- 渲染调度 */
function renderView(v) {
  var map = {
    today: renderToday, plan: renderPlan, focus: renderFocus,
    subject: renderSubject, mistake: renderMistake, stats: renderStats, setting: renderSetting
  };
  var el = document.getElementById('view-' + v);
  if (!el) return;
  el.innerHTML = (map[v] || function () { return ''; })();
  if (v === 'stats') setTimeout(renderStatsCharts, 30);
}
function renderAll() {
  renderNav(); renderTopbar(); renderView(currentView);
  var fabViews = { plan: 'add-task', mistake: 'add-mistake', today: 'add-task' };
  var fab = document.getElementById('fab');
  if (fabViews[currentView]) {
    fab.hidden = false;
    fab.setAttribute('data-act', fabViews[currentView]);
  } else fab.hidden = true;
}
function goto(v) {
  currentView = v;
  $$('.view').forEach(function (e) { e.classList.remove('active'); });
  var el = document.getElementById('view-' + v);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
  renderAll();
}

function openTaskForm(id, date) {
  var t = id ? taskById(id) : null;
  openModal({
    title: t ? '编辑任务' : '新建任务',
    body: taskFormHTML(t, date) + (t ? '<button class="btn danger block mt8" data-act="del-task-inline" data-id="' + t.id + '">删除这条任务</button>' : ''),
    buttons: '<button class="btn ghost" data-close>取消</button><button class="btn primary" data-ok>保存</button>',
    onSubmit: function () {
      var title = val('f_title');
      if (!title) { toast('请填写任务标题', 'warn'); return false; }
      var data = {
        title: title, subjectId: val('f_sub'), date: val('f_date') || todayStr(),
        priority: Number(val('f_prio')), estimatedPomodoros: clamp(Number(val('f_pomo')) || 1, 1, 20),
        note: val('f_note'), status: val('f_status')
      };
      if (t) {
        var wasDone = t.status === 'done';
        Object.keys(data).forEach(function (k) { t[k] = data[k]; });
        if (t.status === 'done' && !wasDone) { t.completedAt = new Date().toISOString(); autoCheckin(todayStr()); }
        if (t.status !== 'done') t.completedAt = null;
        save('tasks'); toast('已更新任务', 'ok');
      } else {
        data.id = uid('t'); data.createdAt = new Date().toISOString(); data.completedAt = null;
        S.tasks.push(data); save('tasks'); toast('已添加任务', 'ok');
      }
      renderAll();
    }

function allChapterNames() {
  var arr = [];
  S.subjects.forEach(function (s) {
    (s.chapters || []).forEach(function (c) {
      arr.push(c.name);
      (c.points || []).forEach(function (p) { arr.push(p.name); });
    });
  });
  return arr.filter(function (v, i, a) { return a.indexOf(v) === i; });
}
function submitMistake(m, keepOpen) {
  var q = val('m_q'), sub = val('m_sub');
  if (!q) { toast('题干必填哦', 'warn'); return false; }
  if (!sub && S.subjects.length) { toast('请选择科目', 'warn'); return false; }
  var data = {
    subjectId: sub, chapter: val('m_chap'), questionType: val('m_type'), reason: val('m_reason'),
    question: q, myAnswer: val('m_my'), rightAnswer: val('m_right'), solution: val('m_sol'),
    tags: val('m_tags').split(/[,，;；\s]+/).filter(Boolean), imageUrl: val('m_img')
  };
  if (m) {
    Object.keys(data).forEach(function (k) { m[k] = data[k]; });
    m.updatedAt = new Date().toISOString();
    save('mistakes'); toast('已更新', 'ok');
  } else {
    data.id = uid('m');
    data.status = 'reviewing'; data.reviewRound = 0;
    data.nextReviewAt = addDays(todayStr(), EB_INTERVALS[0]);   // 创建时：次日 00:00 到期
    data.createdAt = new Date().toISOString(); data.updatedAt = data.createdAt;
    S.mistakes.push(data); save('mistakes');
    toast(keepOpen ? '已记录，继续下一道' : '已记录，明天提醒复习', 'ok');
  }
  renderAll();
  if (keepOpen) setTimeout(function () { openMistakeForm(); }, 150);
  return true;
}

function exportData() {

  Object.keys(KEYMAP).forEach(function (k) { data['kaoyan_' + KEYMAP[k]] = S[k]; });
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kaoyan-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  toast('备份文件已导出', 'ok');
}
function triggerImport() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = function () { if (input.files && input.files[0]) handleImport(input.files[0]); };
  input.click();
}
function handleImport(file) {
  var reader = new FileReader();
  reader.onerror = function () { toast('文件读取失败', 'err'); };
  reader.onload = function () {
    var obj;
    try { obj = JSON.parse(reader.result); }
    catch (e) { toast('这不是合法的 JSON 文件，已取消导入（原数据未受影响）', 'err'); return; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { toast('数据结构不正确，已取消导入', 'err'); return; }
    var keys = Object.keys(KEYMAP).map(function (k) { return 'kaoyan_' + KEYMAP[k]; });
    var found = keys.filter(function (k) { return obj[k] !== undefined; });
    if (!found.length) { toast('未识别到考研工作台的备份字段，已取消导入', 'err'); return; }
    var cnt = {
      t: (obj.kaoyan_tasks || []).length, s: (obj.kaoyan_focus_sessions || []).length,
      m: (obj.kaoyan_mistakes || []).length, sb: (obj.kaoyan_subjects || []).length, p: (obj.kaoyan_exam_papers || []).length
    };
    openModal({
      title: '确认导入',
      body: '<p class="muted">备份文件信息如下，导入后将<b>覆盖当前全部数据</b>，建议先导出一次现有备份。</p>' +
        '<div class="card tight mt8">' +
        '<div class="kv"><span class="k">导出时间</span><span>' + esc(obj.exportedAt ? fmtDT(obj.exportedAt) : '未知') + '</span></div>' +
        '<div class="kv"><span class="k">数据版本</span><span>' + esc(String(obj.version || '未知')) + '</span></div>' +
        '<div class="kv"><span class="k">识别字段</span><span class="num">' + found.length + ' / ' + keys.length + '</span></div>' +
        '<div class="kv"><span class="k">内容</span><span class="num">任务 ' + cnt.t + ' · 专注 ' + cnt.s + ' · 错题 ' + cnt.m + ' · 科目 ' + cnt.sb + ' · 模考 ' + cnt.p + '</span></div>' +
        '</div>' +
        '<div class="banner mt12">当前数据：任务 ' + S.tasks.length + ' · 专注 ' + S.sessions.length + ' · 错题 ' + S.mistakes.length + '</div>',
      buttons: '<button class="btn ghost" data-close>取消</button><button class="btn danger" data-ok>确认覆盖导入</button>',
      onSubmit: function () {
        Object.keys(KEYMAP).forEach(function (k) {
          var v = obj['kaoyan_' + KEYMAP[k]];
          if (v === undefined) return;
          if (k === 'settings') S.settings = Object.assign(S.settings, v);
          else S[k] = v;
        });
        if (!S.reviews || typeof S.reviews !== 'object') S.reviews = { daily: {}, weekly: {} };
        if (!S.reviews.daily) S.reviews.daily = {};
        if (!S.reviews.weekly) S.reviews.weekly = {};
        if (!S.checkins || typeof S.checkins !== 'object') S.checkins = {};
        saveAll();
        applyTheme(S.settings.theme, S.settings.accentColor);
        renderAll(); toast('导入完成', 'ok');
      }
    });
  };
  reader.readAsText(file);
}

  if (meta) meta.setAttribute('content', dark ? '#141A18' : '#FAF8F3');

}

/* ==========================================================================
   交互层：事件委托
   ========================================================================== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  switch (act) {
    /* 导航 */
    case 'goto':
      goto(el.getAttribute('data-view')); break;

    /* 今日 */
    case 'roll-over': {
      var t = todayStr(), n = 0;
      S.tasks.forEach(function (x) { if (x.status !== 'done' && x.date < t) { x.date = t; n++; } });
      save('tasks'); toast('已把 ' + n + ' 项任务顺延到今天', 'ok'); renderAll(); break;
    }
    case 'ignore-overdue': UI.overdueIgnored = true; renderAll(); break;
    case 'checkin-now': autoCheckin(todayStr()); toast('今日打卡完成 🔥', 'ok'); renderAll(); break;
    case 'save-daily-review': {
      var t2 = todayStr();
      S.reviews.daily[t2] = { learned: val('rv_learned'), problems: val('rv_problems'), tomorrow: val('rv_tomorrow') };
      save('reviews'); toast('复盘已保存', 'ok'); break;
    }

    /* 任务 */
    case 'add-task': openTaskForm(null, el.getAttribute('data-date') || UI.planDate); break;
    case 'edit-task': openTaskForm(id); break;
    case 'toggle-task': {
      var tk = taskById(id); if (!tk) break;
      if (tk.status === 'done') { tk.status = 'todo'; tk.completedAt = null; }
      else { tk.status = 'done'; tk.completedAt = new Date().toISOString(); autoCheckin(todayStr()); }
      save('tasks'); renderAll(); break;
    }
    case 'del-task-inline': {
      var m = modalStack[modalStack.length - 1];
      confirmBox('删除任务', '这条任务删除后无法恢复，确定吗？', '删除', true).then(function (ok) {
        if (ok) { S.tasks = S.tasks.filter(function (x) { return x.id !== id; }); save('tasks'); toast('已删除', 'ok'); renderAll(); }
        if (m) { m.remove(); modalStack = modalStack.filter(function (x) { return x !== m; }); }
      });
      break;
    }
    case 'focus-task': {
      var tk2 = taskById(id);
      startTimer('focus', FS.lastMinutes || 25, 'countdown', id, tk2 ? tk2.subjectId : '');
      goto('focus'); break;
    }

    /* 计划 */
    case 'plan-mode': UI.planMode = el.getAttribute('data-m'); renderAll(); break;
    case 'day-move': UI.planDate = addDays(UI.planDate, Number(el.getAttribute('data-n'))); UI.planWeek = UI.planDate; renderAll(); break;
    case 'week-move': UI.planWeek = addDays(UI.planWeek, Number(el.getAttribute('data-n'))); renderAll(); break;
    case 'edit-phase': openPhaseForm(id); break;
    case 'save-weekly-review': {
      var wk = weekKey(UI.planWeek);
      S.reviews.weekly[wk] = { summary: val('wr_summary'), weakness: val('wr_weakness'), nextWeek: val('wr_next') };
      save('reviews'); toast('周复盘已保存', 'ok'); break;
    }

    /* 专注 */

    case 'fmode': FS.mode = el.getAttribute('data-m'); fsSave(); renderView('focus'); break;
    case 'pick-min': FS.lastMinutes = Number(el.getAttribute('data-m')); fsSave(); renderView('focus'); break;
    case 'start-focus': {
      var mins = FS.mode === 'countdown' ? clamp(Number(val('fCustom')) || 25, 5, 180) : 0;
      var taskId = val('fTask'), subId = val('fSubject');

      if (!subId && tk3) subId = tk3.subjectId;
      startTimer('focus', mins || 25, FS.mode, taskId, subId); break;
