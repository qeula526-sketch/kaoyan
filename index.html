    case 'import': triggerImport(); break;
    case 'seed':
      confirmBox('生成示例数据', '将向当前数据追加：1 条今日任务、2 道错题、1 条专注记录、连续 3 天打卡。已有数据不会被覆盖。', '生成', false)
        .then(function (ok) { if (ok) { seedSample(); renderAll(); } });
      break;
    case 'clear': {
      var body = '<p class="muted">此操作会<b>删除本浏览器中的全部数据</b>（任务、专注、错题、打卡、复盘、设置），且不可恢复。</p>' +
        '<div class="banner mt8">强烈建议先点「导出 JSON 备份」保存一份。</div>' +
        '<div class="field mt8"><label>请输入「确认清空」以继续</label><input type="text" id="clearTxt" placeholder="确认清空"></div>';
      openModal({
        title: '清空全部数据',
        body: body,
        buttons: '<button class="btn ghost" data-close>取消</button><button class="btn danger" data-ok>清空</button>',
        onSubmit: function () {
          if (val('clearTxt') !== '确认清空') { toast('请输入「确认清空」四个字', 'warn'); return false; }
          Object.keys(KEYMAP).forEach(function (k) { DB.del(KEYMAP[k]); });
          DB.del(FM_KEY);
          location.reload();
        }
      });
      break;
    }

    /* 引导 */
    case 'ob-goal': {
      var gi = document.getElementById('ob_goal');
      if (gi) gi.value = el.getAttribute('data-g');
      break;
    }
  }
});

/* 错题筛选：输入与下拉变更 */
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'mq') {
    UI.mistakeQ = e.target.value;
    var view = document.getElementById('view-mistake');
    if (view && currentView === 'mistake') {
      var list = view.querySelector('.mt12:last-child');
      // 简单整页重绘，但保留焦点
      var pos = e.target.selectionStart;
      renderView('mistake');
      var again = document.getElementById('mq');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    }
  }
});
document.addEventListener('change', function (e) {
  if (!e.target) return;
  if (e.target.id === 'msub') { UI.mistakeSub = e.target.value; renderView('mistake'); }
  else if (e.target.id === 'mreason') { UI.mistakeReason = e.target.value; renderView('mistake'); }
  else if (e.target.id === 'msort') { UI.mistakeSort = e.target.value; renderView('mistake'); }
  else if (e.target.id === 'wkPicker' && e.target.value) {
    // 切到包含该周的一天
    UI.planWeek = e.target.value.slice(0, 4) + '-01-01';
    var y = Number(e.target.value.slice(0, 4)), w = Number(e.target.value.slice(6));
    var jan4 = new Date(y, 0, 4);
    var monday = new Date(jan4.getTime());
    monday.setDate(jan4.getDate() - ((jan4.getDay() || 7) - 1) + (w - 1) * 7);
    UI.planWeek = todayStr(monday);
    renderAll();
  }
  else if (e.target.hasAttribute && e.target.hasAttribute('data-ob-sub')) {
    OB.subs[Number(e.target.getAttribute('data-ob-sub'))] = e.target.checked;
  }
});

/* 周视图任务拖拽（跨日期顺延） */
document.addEventListener('dragstart', function (e) {
  var t = e.target.closest && e.target.closest('[data-drag-task]');
  if (t) e.dataTransfer.setData('text/plain', t.getAttribute('data-drag-task'));
});
document.addEventListener('dragover', function (e) {
  var d = e.target.closest && e.target.closest('[data-dropday]');
  if (d) { e.preventDefault(); d.classList.add('drop-hint'); }
});
document.addEventListener('dragleave', function (e) {
  var d = e.target.closest && e.target.closest('[data-dropday]');
  if (d) d.classList.remove('drop-hint');
});
document.addEventListener('drop', function (e) {
  var d = e.target.closest && e.target.closest('[data-dropday]');
  if (!d) return;
  e.preventDefault();
  var tid = e.dataTransfer.getData('text/plain');
  var tk = taskById(tid);
  if (tk) { tk.date = d.getAttribute('data-dropday'); save('tasks'); toast('已顺延到 ' + tk.date, 'ok'); }
  renderAll();
});

/* 顶栏滚动态势 */
window.addEventListener('scroll', function () {
  var tb = document.getElementById('topbar');
  if (tb) tb.classList.toggle('stuck', window.scrollY > 4);
}, { passive: true });

/* 引导层按钮 */
document.addEventListener('click', function (e) {
  if (e.target.id === 'obNext') {
    if (OB.step === 0) {
      var ex = val('ob_exam'); if (ex) S.settings.examDate = ex;
      S.settings.school = val('ob_school'); S.settings.major = val('ob_major');
      S.phases[3].end = md(S.settings.examDate);
      OB.step = 1; renderOnboarding();
    } else if (OB.step === 1) {
      S.settings.dailyGoalMinutes = clamp(Number(val('ob_goal')) || 300, 30, 960);
      OB.step = 2; renderOnboarding();
    } else if (OB.step === 2) {
      var defs = defaultSubjects();
      S.subjects = defs.filter(function (_, i) { return OB.subs[i]; });
      OB.step = 3; renderOnboarding();
    } else {
      var sample = document.getElementById('ob_sample');
      if (sample && sample.checked) seedSample(true);
      finishOnboarding();
    }
  } else if (e.target.id === 'obPrev') {
    if (OB.step > 0) { OB.step--; renderOnboarding(); }
  } else if (e.target.id === 'obSkip') {
    S.subjects = defaultSubjects().filter(function (_, i) { return OB.subs[i]; });
    finishOnboarding();
  }
});

/* ==========================================================================
   启动
   ========================================================================== */
function boot() {
  applyTheme(S.settings.theme || 'system', S.settings.accentColor || 'teal');

  if (!S.meta) {
    // 首次启动：不再强制走 4 步引导——直接写入默认配置进入主界面
    // （原来每次清掉存储都会重走引导，很烦；引导改为需要时手动打开）
    S.meta = { version: '1.0.0', createdAt: new Date().toISOString(), seeded: true };
    S.settings.examDate = '2027-12-25';
    S.settings.school = '北京邮电大学';
    S.settings.major = '085404 计算机技术';
    S.settings.targetScore = 390;
    save('meta'); save('settings'); save('subjects'); save('phases');
  }
  $('#onboarding').hidden = true;
  $('#appMain').hidden = false;

  // 恢复未完成的计时（刷新 / 后台返回后时间仍准确）
  if (FS.phase === 'running') {
    if (FS.mode === 'countdown' && remainingMs() <= 0) { autoFinish(); }
    else { startTicking(); updateTitle(); }
  } else if (FS.phase === 'paused') {
    updateTitle();
  }
  goto('today');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }

<div id="installFab" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9999;
  background:#2F5D50;color:#fff;border:none;border-radius:999px;padding:13px 26px;font-size:15px;font-weight:600;
  box-shadow:0 10px 28px rgba(0,0,0,.28);font-family:inherit;">安装到桌面</div>
<script>
(function(){
  var fab = document.getElementById('installFab');
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (isStandalone) return;
  if (isIOS) {
    fab.textContent = '点底部「分享」→ 添加到主屏幕';
    fab.style.display = 'block';
    setTimeout(function(){ fab.style.display = 'none'; }, 12000);
    return;
  }
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; fab.style.display = 'block';
  });
  fab.addEventListener('click', function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ fab.style.display = 'none'; });
  });
})();
</script>
